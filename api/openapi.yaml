  /organizations/{organizationID}/corrections:
    get:
      operationId: listCorrections
      summary: List correction requests for an organisation
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200': { description: Correction requests }
  /organizations/{organizationID}/corrections/{correctionID}/decide:
    post:
      operationId: decideCorrection
      summary: Review or decide a correction request
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - name: correctionID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Correction decision }

  /organizations/{organizationID}/payments:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listOrganizationPayments
      summary: List payments across an organisation's obligations
      responses:
        '200': { description: Organisation payments }
  /organizations/{organizationID}/collections:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listOrganizationCollections
      summary: List collection attempts across an organisation
      responses:
        '200': { description: Organisation collection attempts }
  /organizations/{organizationID}/overdue:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listOrganizationOverdue
      summary: List overdue repayment obligations
      responses:
        '200': { description: Overdue obligations }
  /organizations/{organizationID}/customers:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listOrganizationCustomers
      summary: List customers with current exposure
      responses:
        '200': { description: Organisation customers }
  /buyer/mandates:
    get:
      operationId: listBuyerMandates
      summary: List the authenticated buyer's payment mandates
      responses:
        '200': { description: Buyer mandates }
  /buyer/trade-lines:
    get:
      operationId: listBuyerTradeLines
      summary: List the authenticated buyer's trade lines
      responses:
        '200': { description: Buyer trade lines }
  /buyer/disputes:
    get:
      operationId: listBuyerDisputes
      summary: List the authenticated buyer's disputes
      responses:
        '200': { description: Buyer disputes }
  /buyer/disputes/{disputeID}:
    parameters:
      - $ref: '#/components/parameters/DisputeID'
    get:
      operationId: getBuyerDispute
      summary: Read an authenticated buyer's dispute, evidence, and decisions
      responses:
        '200': { description: Buyer dispute timeline }
        '404': { description: Dispute is absent or belongs to another buyer }
  /buyer/disputes/{disputeID}/evidence:
    parameters:
      - $ref: '#/components/parameters/DisputeID'
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
    post:
      operationId: addBuyerDisputeEvidence
      summary: Append evidence to an authenticated buyer's dispute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceInput'
      responses:
        '201': { description: Evidence appended }
        '404': { description: Dispute is absent or belongs to another buyer }

  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Read the authenticated user's required and optional communication choices
      responses:
        '200': { description: Notification preferences }
    put:
      operationId: updateNotificationPreferences
      summary: Update future optional-message routing and quiet hours
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferred_channel, fallback_channel, payment_reminders_enabled, product_updates_enabled, quiet_start_hour, quiet_end_hour, timezone, expected_version]
              properties:
                preferred_channel: { type: string, enum: [email, sms, whatsapp] }
                fallback_channel: { type: string, enum: [email, sms, whatsapp] }
                payment_reminders_enabled: { type: boolean }
                product_updates_enabled: { type: boolean }
                quiet_start_hour: { type: integer, minimum: 0, maximum: 23 }
                quiet_end_hour: { type: integer, minimum: 0, maximum: 23 }
                timezone: { type: string, const: Africa/Lagos }
                expected_version: { type: integer, minimum: 1 }
                disable_required: { type: boolean, description: Always rejected when true. }
      responses:
        '200': { description: Preferences updated }
        '409': { description: Required messages cannot be disabled or the version is stale }
  /me/recovery-codes/regenerate:
    post:
      operationId: regenerateRecoveryCodes
      summary: Revoke old recovery codes and display a new one-time set
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200': { description: Recovery codes shown once }
  /account-recovery/requests:
    post:
      security: []
      operationId: requestAccountRecovery
      summary: Start enumeration-safe account recovery
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, channel]
              properties:
                identifier: { type: string }
                channel: { type: string, enum: [email, phone] }
      responses:
        '202': { description: The same response is returned whether or not an account exists }
  /account-recovery/requests/{requestID}/evidence:
    post:
      security: []
      operationId: addAccountRecoveryEvidence
      summary: Add independently verified evidence to a recovery request
      parameters:
        - { name: requestID, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200': { description: Evidence accepted }
  /account-recovery/requests/{requestID}/complete:
    post:
      security: []
      operationId: completeAccountRecovery
      summary: Complete an approved recovery after cooling-off
      parameters:
        - { name: requestID, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200': { description: Recovery completed and existing sessions revoked }
  /me/privacy-requests:
    get:
      operationId: listMyPrivacyRequests
      summary: List the authenticated user's privacy requests
      responses:
        '200': { description: Privacy requests }
    post:
      operationId: createPrivacyRequest
      summary: Submit an identity-bound privacy-rights request
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '201': { description: Privacy request received }
  /me/privacy-requests/{requestID}/export:
    get:
      operationId: downloadPrivacyExport
      summary: Download an unexpired privacy-filtered export belonging to the authenticated user
      parameters:
        - { name: requestID, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Protected authoritative JSON export }
        '404': { description: Export missing, expired, or belongs to another user }
  /me/account-recovery/{requestID}/cancel:
    post:
      operationId: cancelAccountRecovery
      summary: Cancel an active recovery from a genuine signed-in session
      parameters:
        - { name: requestID, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '204': { description: Recovery cancelled }
  /ops/account-recovery:
    get:
      operationId: listRecoveryReviews
      summary: List recovery cases for authorized independent review
      responses:
        '200': { description: Recovery review queue }
  /ops/account-recovery/{requestID}/review:
    post:
      operationId: reviewAccountRecovery
      summary: Independently approve with cooling-off or reject a verified recovery
      parameters:
        - { name: requestID, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200': { description: Recovery review recorded }
  /ops/privacy-requests:
    get:
      operationId: listPrivacyReviews
      summary: List privacy requests for authorized compliance review
      responses:
        '200': { description: Privacy review queue }
  /ops/privacy-requests/{requestID}/decide:
    post:
      operationId: decidePrivacyRequest
      summary: Record a reasoned retention-aware privacy decision
      parameters:
        - { name: requestID, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200': { description: Privacy decision recorded }
  /ops/privacy-requests/{requestID}/complete:
    post:
      operationId: completePrivacyRequest
      summary: Complete approved privacy work under dual control
      parameters:
        - { name: requestID, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200': { description: Privacy request completed }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kredit_session
  parameters:
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Reuse this key to safely retry a mutating request; a different payload returns IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    OrganizationID:
      name: organizationID
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
    RequestID:
      name: requestID
      in: path
      required: true
      schema:
        type: string
    PaymentID:
      name: paymentID
      in: path
      required: true
      schema:
        type: string
    LineID:
      name: lineID
      in: path
      required: true
      schema:
        type: string
    DrawdownID:
      name: drawdownID
      in: path
      required: true
      schema:
        type: string
    AttemptID:
      name: attemptID
      in: path
      required: true
      schema:
        type: string
    DisputeID:
      name: disputeID
      in: path
      required: true
      schema:
        type: string
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 64
  schemas:
    OperationsCommandInput:
      type: object
      required: [command_type, target_type, target_id, reason, expected_version]
      properties:
        command_type:
          type: string
          enum: [retry_job, retry_webhook, suspend_user, restore_user, suspend_organization, restore_organization, place_risk_hold, lift_risk_hold, request_reconciliation, resolve_unknown_submission, retry_collection, cancel_collection]
        target_type: { type: string, minLength: 1, maxLength: 64 }
        target_id: { type: string, minLength: 1, maxLength: 256 }
        organization_id: { type: string, format: uuid }
        reason: { type: string, minLength: 8, maxLength: 1000 }
        expected_version: { type: integer, format: int64, minimum: 1 }
        scope:
          type: string
          enum: [credit, release, collection, settlement, all_sensitive]
        expires_at: { type: string, format: date-time }
        resolution: { type: string, maxLength: 2000 }
    OnboardingContactRequest:
      type: object
      required: [identifier, channel]
      properties:
        identifier: { type: string }
        channel: { type: string, enum: [email, phone] }
    OnboardingContactVerifyRequest:
      allOf:
        - $ref: '#/components/schemas/OnboardingContactRequest'
        - type: object
          required: [challenge_id, code]
          properties:
            challenge_id: { type: string }
            code: { type: string, pattern: '^[0-9]{6}$' }
    OnboardingRepresentativeRequest:
      type: object
      required: [expected_version, name, title]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 2 }
        title: { type: string, minLength: 2 }
    ProviderReferenceRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
    SettlementRequest:
      type: object
      required: [expected_version, provider, provider_reference, bank_name, account_name, account_last4]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        provider: { type: string }
        provider_reference: { type: string }
        bank_name: { type: string }
        account_name: { type: string }
        account_last4: { type: string, pattern: '^[0-9]{4}$' }
    BillingRequest:
      type: object
      required: [expected_version, method, provider_reference, cycle]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        method: { type: string, enum: [split_settlement, authorized_debit, consolidated_invoice] }
        provider_reference: { type: string }
        cycle: { type: string }
    DefaultCreditPolicyRequest:
      type: object
      required: [expected_version, credit_limit_kobo, payment_days, grace_hours]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        credit_limit_kobo: { type: integer, format: int64, minimum: 1 }
        payment_days: { type: integer, minimum: 1, maximum: 365 }
        grace_hours: { type: integer, minimum: 0, maximum: 720 }
    SupplierConsentRequest:
      type: object
      required: [expected_version, terms_version, privacy_version]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        terms_version: { type: string }
        privacy_version: { type: string }
    CreditRequestInput:
      type: object
      required: [buyer_user_id, buyer_business_id, buyer_legal_name, principal_kobo, goods_description, due_date, collection_at]
      properties:
        buyer_user_id: {type: string}
        buyer_business_id: {type: string}
        buyer_legal_name: {type: string}
        buyer_trading_name: {type: string}
        principal_kobo: {type: integer, format: int64, minimum: 1}
        goods_description: {type: string}
        invoice_reference: {type: string}
        invoice_document_hash: {type: string}
        due_date: {type: string, format: date}
        grace_hours: {type: integer, minimum: 0, maximum: 720}
        collection_at: {type: string, format: date-time}
        schedule_type: {type: string, enum: [one_time, equal, custom], default: one_time}
        schedule_count: {type: integer, minimum: 2, maximum: 60}
        schedule_cadence: {type: string, enum: [weekly, fortnightly, monthly, custom]}
        month_end_policy: {type: string, enum: [last_day, cap]}
        custom_schedule_items:
          type: array
          minItems: 2
          maxItems: 60
          items:
            type: object
            required: [amount_kobo, due_date]
            properties:
              amount_kobo: {type: integer, format: int64, minimum: 1}
              due_date: {type: string, format: date}
    CreditAcceptRequest:
      type: object
      required: [agreement_version_id, agreement_hash, mandate_provider_id]
      properties:
        agreement_version_id: {type: string}
        agreement_hash: {type: string}
        mandate_provider_id: {type: string}
    CreditDraftUpdate:
      type: object
      required: [expected_version, principal_kobo, goods_description, due_date, collection_at]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
        principal_kobo: {type: integer, format: int64, minimum: 1}
        goods_description: {type: string}
        invoice_reference: {type: string}
        invoice_document_hash: {type: string}
        due_date: {type: string, format: date}
        grace_hours: {type: integer, minimum: 0, maximum: 720}
        collection_at: {type: string, format: date-time}
        schedule_type: {type: string, enum: [one_time, equal, custom]}
        schedule_count: {type: integer, minimum: 2, maximum: 60}
        schedule_cadence: {type: string, enum: [weekly, fortnightly, monthly, custom]}
        month_end_policy: {type: string, enum: [last_day, cap]}
        custom_schedule_items:
          type: array
          minItems: 2
          maxItems: 60
          items:
            type: object
            required: [amount_kobo, due_date]
            properties:
              amount_kobo: {type: integer, format: int64, minimum: 1}
              due_date: {type: string, format: date}
    PaymentInput:
      type: object
      required: [amount_kobo, idempotency_key]
      properties:
        source_type: {type: string, enum: [integrated_voluntary, supplier_recorded_transfer, buyer_payment_claim, cash_recorded, kredit_collection, adjustment]}
        amount_kobo: {type: integer, format: int64, minimum: 1}
        currency: {type: string, enum: [NGN]}
        provider: {type: string}
        provider_reference: {type: string}
        paid_at: {type: string, format: date-time}
        idempotency_key: {type: string}
    PaymentClaimInput:
      type: object
      required: [amount_kobo, paid_at, transfer_reference]
      properties:
        amount_kobo: {type: integer, format: int64, minimum: 1}
        paid_at: {type: string, format: date-time}
        source_account_masked: {type: string, maxLength: 64}
        transfer_reference: {type: string, minLength: 1, maxLength: 200}
        evidence_document_id: {type: string, format: uuid}
    PaymentClaimDecisionInput:
      type: object
      required: [decision, reason]
      properties:
        decision: {type: string, enum: [confirmed, rejected]}
        reason: {type: string, minLength: 1, maxLength: 500}
    ScheduleInput:
      type: object
      required: [schedule_type, start_date, timezone, grace_hours, cadence]
      properties:
        schedule_type: {type: string, enum: [equal, custom]}
        count: {type: integer, minimum: 1, maximum: 60}
        instalment_amount_kobo: {type: integer, format: int64, minimum: 1}
        start_date: {type: string, format: date-time}
        due_hour: {type: integer, minimum: 0, maximum: 23}
        due_minute: {type: integer, minimum: 0, maximum: 59}
        timezone: {type: string}
        grace_hours: {type: integer, minimum: 0, maximum: 720}
        cadence: {type: string, enum: [weekly, fortnightly, monthly, custom]}
        month_end_policy: {type: string, enum: [last_day, cap]}
        allocation_policy: {type: string}
        custom_items:
          type: array
          items:
            type: object
            required: [amount_kobo, due_date]
            properties:
              amount_kobo: {type: integer, format: int64, minimum: 1}
              due_date: {type: string, format: date-time}
    TradeLineInput:
      type: object
      required: [buyer_user_id, buyer_business_id, approved_limit_kobo, start_at, end_at, mandate_id]
      properties:
        buyer_user_id: {type: string}
        buyer_business_id: {type: string}
        approved_limit_kobo: {type: integer, format: int64, minimum: 1}
        cadence: {type: string}
        default_grace_hours: {type: integer, minimum: 0, maximum: 720}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        mandate_id: {type: string}
        terms_version: {type: string}
    DrawdownInput:
      type: object
      required: [principal_kobo, goods_description, due_date, collection_at, idempotency_key]
      properties:
        principal_kobo: {type: integer, format: int64, minimum: 1}
        goods_description: {type: string}
        invoice_reference: {type: string}
        invoice_document_hash: {type: string}
        due_date: {type: string, format: date}
        collection_at: {type: string, format: date-time}
        idempotency_key: {type: string}
        expires_at: {type: string, format: date-time}
    CollectionStartInput:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: {type: string}
    CollectionWebhook:
      type: object
      required: [event_id, external_reference, state, succeeded_amount_kobo, signature]
      properties:
        event_id: {type: string}
        external_reference: {type: string}
        state: {type: string, enum: [succeeded, partial, failed, pending]}
        provider_collection_id: {type: string}
        succeeded_amount_kobo: {type: integer, format: int64, minimum: 0}
        failure_code: {type: string}
        retryable: {type: boolean}
        settlement_state: {type: string, enum: [settled, settlement_pending, reversed]}
        settlement_reference: {type: string}
        signature: {type: string}
    ProviderStatus:
      type: object
      required: [name, feature_enabled, capabilities, health]
      properties:
        name: {type: string}
        feature_enabled: {type: boolean}
        capabilities:
          type: object
          additionalProperties: {type: boolean}
        health:
          type: object
          required: [state, healthy, consecutive_failures]
          properties:
            state: {type: string, enum: [closed, open, half_open]}
            healthy: {type: boolean}
            consecutive_failures: {type: integer, minimum: 0}
            last_error: {type: string}
            last_failure_at: {type: string, format: date-time}
            open_until: {type: string, format: date-time}
    ReadinessReport:
      type: object
      required: [generated_at, environment, ready, gates, missing, pilot_limits]
      properties:
        generated_at: {type: string, format: date-time}
        environment: {type: string}
        ready: {type: boolean}
        gates:
          type: array
          items:
            type: object
            required: [name, passed, detail]
            properties:
              name: {type: string}
              passed: {type: boolean}
              detail: {type: string}
        missing: {type: array, items: {type: string}}
        pilot_limits: {type: object, additionalProperties: true}
    DisputeInput:
      type: object
      required: [disputed_amount_kobo, reason]
      properties:
        disputed_amount_kobo: {type: integer, format: int64, minimum: 1}
        reason: {type: string}
        explanation: {type: string}
        collection_effect: {type: string, enum: [FULL_BLOCK, CONTESTED_ONLY, NO_AUTOMATIC_BLOCK]}
    EvidenceInput:
      type: object
      properties:
        document_id: {type: string}
        statement: {type: string}
    DecisionInput:
      type: object
      required: [outcome, reason]
      properties:
        outcome: {type: string, enum: [upheld, rejected, partial, withdrawn]}
        valid_principal_kobo: {type: integer, format: int64, minimum: 0}
        adjustment_kobo: {type: integer, format: int64, minimum: 0}
        remaining_disputed_kobo: {type: integer, format: int64, minimum: 0}
        reason: {type: string}
    OperationInput:
      type: object
      required: [amount_kobo, reason]
      properties:
        amount_kobo: {type: integer, format: int64, minimum: 1}
        reason: {type: string}
        approved_by: {type: string}
    WhatsAppWebhook:
      type: object
      required: [id, from, text, signature]
      properties:
        id: {type: string}
        from: {type: string}
        text: {type: string}
        signature: {type: string}
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
    MetaResponse:
      type: object
      required: [service, version, environment, timezone, currency, money_unit]
      properties:
        service:
          type: string
        version:
          type: string
        environment:
          type: string
        timezone:
          type: string
        currency:
          type: string
        money_unit:
          type: string
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        request_id:
          type: string
    OTPRequest:
      type: object
      required: [identifier, channel]
      properties:
        identifier:
          type: string
        channel:
          type: string
          enum: [phone, email]
        purpose:
          type: string
          default: login
    OTPChallengeResponse:
      type: object
      required: [challenge_id, expires_at, channel, message]
      properties:
        challenge_id:
          type: string
        expires_at:
          type: string
          format: date-time
        channel:
          type: string
        message:
          type: string
        development_code:
          type: string
          description: Development-only value; never returned in production.
    OTPVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
        device_label:
          type: string
    TOTPVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
    User:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: string
        email:
          type: string
        phone:
          type: string
        display_name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
    Session:
      type: object
