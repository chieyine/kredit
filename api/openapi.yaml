openapi: 3.1.0
info:
  title: Kredit API
  version: 0.1.0
  description: Contract-first API for Kredit production v1.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      security: []
      operationId: health
      summary: Liveness probe
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      security: []
      operationId: readiness
      summary: Readiness probe
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is not ready.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /meta:
    get:
      security: []
      operationId: metadata
      summary: Runtime metadata
      responses:
        '200':
          description: Runtime metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
  /auth/otp/challenges:
    post:
      security: []
      operationId: requestOTP
      summary: Request a passwordless OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequest'
      responses:
        '202':
          description: Challenge accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPChallengeResponse'
        '429':
          description: Rate limited or resend cooldown active.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/otp/verify:
    post:
      security: []
      operationId: verifyOTP
      summary: Verify an OTP and create a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
      responses:
        '200':
          description: Authenticated session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired OTP.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current browser session
      responses:
        '204':
          description: Session revoked.
  /secure-link:
    get:
      security: []
      operationId: resolveSecureLink
      summary: Verify a signed, expiring in-product link
      parameters:
        - {name: path, in: query, required: true, schema: {type: string}}
        - {name: exp, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: sig, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Link verified and safe internal destination returned.
        '410':
          description: Link is invalid or expired.
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the current user and memberships
      responses:
        '200':
          description: Current authenticated context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Authentication required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /mfa/totp/enroll:
    post:
      operationId: enrollTOTP
      summary: Start TOTP enrollment for the current user
      responses:
        '200':
          description: TOTP secret and provisioning URI.
  /mfa/totp/verify:
    post:
      operationId: verifyTOTP
      summary: Verify TOTP and elevate the current session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPVerifyRequest'
      responses:
        '200':
          description: Session elevated to AAL2.
  /organizations:
    get:
      operationId: listOrganizations
      summary: List organizations for the current user
      responses:
        '200':
          description: Organizations.
    post:
      operationId: createOrganization
      summary: Create a supplier organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
      responses:
        '201':
          description: Organization and owner membership created.
  /organizations/{organizationID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getOrganization
      summary: Get an organization in the current tenant context
      responses:
        '200':
          description: Organization and current membership.
  /organizations/{organizationID}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listMembers
      summary: List organization memberships
      responses:
        '200':
          description: Organization members.
    post:
      operationId: inviteMember
      summary: Invite a non-owner organization member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInvitationRequest'
      responses:
        '202':
          description: Invitation created.
  /organizations/{organizationID}/members/{userID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/UserID'
    patch:
      operationId: changeMemberRole
      summary: Change a non-owner member role or access status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRoleRequest'
      responses:
        '200':
          description: Membership updated.
  /organizations/{organizationID}/audit-events:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listAuditEvents
      summary: List organization audit events
      responses:
        '200':
          description: Audit events.
  /organizations/{organizationID}/onboarding:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getSupplierOnboarding
      summary: Get the server-derived supplier onboarding and readiness summary
      responses:
        '200':
          description: Permission-filtered profile, current versions, and readiness requirements.
  /organizations/{organizationID}/onboarding/contacts/challenges:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
    post:
      operationId: requestSupplierContactVerification
      summary: Send an OTP for an owner email or phone after recent MFA
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingContactRequest' }
      responses: { '202': { description: Verification challenge created. } }
  /organizations/{organizationID}/onboarding/contacts/verify:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
    post:
      operationId: verifySupplierContact
      summary: Verify and attach an owner contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingContactVerifyRequest' }
      responses: { '200': { description: Contact evidence and readiness updated. } }
  /organizations/{organizationID}/onboarding/representative:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
    patch:
      operationId: updateSupplierRepresentative
      summary: Save the authorised representative after recent MFA
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingRepresentativeRequest' } } } }
      responses: { '200': { description: Representative saved. } }
  /organizations/{organizationID}/onboarding/kyb:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
    post:
      operationId: submitSupplierKYB
      summary: Submit a provider-hosted KYB reference after recent MFA
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderReferenceRequest' } } } }
      responses: { '200': { description: Provider review state recorded. } }
  /organizations/{organizationID}/onboarding/settlement:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
    put:
      operationId: updateSupplierSettlement
      summary: Save a provider reference and masked settlement destination after recent MFA
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementRequest' } } } }
      responses: { '200': { description: Settlement verification state recorded without full bank details. } }
  /organizations/{organizationID}/onboarding/billing:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
    put:
      operationId: updateSupplierBilling
      summary: Configure the supplier billing method after recent MFA
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BillingRequest' } } } }
      responses: { '200': { description: Billing instruction recorded. } }
  /organizations/{organizationID}/onboarding/credit-policy:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
    put:
      operationId: updateSupplierDefaultCreditPolicy
      summary: Configure safe defaults for new supplier credit
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DefaultCreditPolicyRequest' } } } }
      responses: { '200': { description: Default policy recorded. } }
  /organizations/{organizationID}/onboarding/consents:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
    post:
      operationId: acceptSupplierOnboardingConsents
      summary: Accept the current supplier terms and privacy versions as owner
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierConsentRequest' } } } }
      responses: { '200': { description: Versioned consent evidence recorded. } }
  /organizations/{organizationID}/documents:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: uploadDocument
      summary: Upload an invoice or evidence document for scanning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, file_name, content_type, retention_class, content_base64]
              properties:
                purpose: {type: string}
                file_name: {type: string}
                content_type: {type: string, enum: [application/pdf, image/jpeg, image/png]}
                retention_class: {type: string}
                content_base64: {type: string}
      responses:
        '202': {description: Document accepted for scanning}
  /organizations/{organizationID}/documents/upload-slot:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: createDocumentUploadSlot
      summary: Create quarantined document metadata and a short-lived direct-upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, file_name, content_type, retention_class, size_bytes]
              properties:
                purpose: {type: string}
                file_name: {type: string}
                content_type: {type: string, enum: [application/pdf, image/jpeg, image/png]}
                retention_class: {type: string}
                size_bytes: {type: integer, format: int64, minimum: 1, maximum: 26214400}
      responses:
        '201': {description: Upload slot created}
  /organizations/{organizationID}/documents/{documentID}/complete:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: documentID
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: completeDocumentUpload
      summary: Verify a direct upload and enqueue it for malware scanning
      responses:
        '202': {description: Upload verified and awaiting scan}
  /organizations/{organizationID}/documents/{documentID}/download:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: documentID
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: documentDownload
      summary: Get a short-lived signed document URL
      responses:
        '200': {description: Signed document URL}
  /organizations/{organizationID}/support-cases:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listSupportCases
      summary: List support cases for an organisation
      responses:
        '200': {description: Support cases}
    post:
      operationId: openSupportCase
      summary: Open a support case tied to a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type, subject_id]
              properties:
                subject_type: {type: string}
                subject_id: {type: string}
                break_glass: {type: boolean}
      responses:
        '201': {description: Support case opened}
  /organizations/{organizationID}/support-cases/{caseID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: caseID
        in: path
        required: true
        schema: {type: string}
    patch:
      operationId: transitionSupportCase
      summary: Transition a support case and append an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: {type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]}
                note: {type: string}
      responses:
        '200': {description: Support case updated}
  /buyer/relationships/consents:
    get:
      operationId: listBuyerConsents
      summary: List the authenticated buyer's relationship consents
      responses:
        '200': {description: Buyer relationship consents}
    post:
      operationId: recordBuyerConsent
      summary: Record a versioned buyer relationship consent decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_organization_id, consent_type, version, evidence_hash, granted]
              properties:
                supplier_organization_id: {type: string}
                consent_type: {type: string}
                version: {type: string}
                evidence_hash: {type: string}
                granted: {type: boolean}
      responses:
        '201': {description: Consent recorded}
  /organizations/{organizationID}/buyer-invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: createBuyerInvitation
      summary: Create a secure buyer onboarding invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerInvitationRequest'
      responses:
        '202':
          description: Buyer invitation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerInvitationCreatedResponse'
  /buyer-invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      security: []
      operationId: previewBuyerInvitation
      summary: Preview a secure buyer invitation
      responses:
        '200':
          description: Safe invitation preview.
        '404':
          description: Invalid or expired invitation.
  /buyer-invitations/{token}/otp:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      security: []
      operationId: requestBuyerInvitationOTP
      summary: Request OTP for the intended buyer contact
      responses:
        '202':
          description: Buyer verification challenge created.
  /buyer-invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      security: []
      operationId: acceptBuyerInvitation
      summary: Verify the buyer and create the buyer portal account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerInvitationAcceptRequest'
      responses:
        '201':
          description: Buyer portal account created and verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerPortalResponse'
  /buyer/me:
    get:
      operationId: getBuyerPortal
      summary: Get the current buyer portal profile
      responses:
        '200':
          description: Buyer person, business, authority, verification, and consent state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerPortalResponse'
  /buyer/credit-requests:
    get:
      operationId: listBuyerCreditRequests
      summary: List credit requests and obligations belonging to the current buyer
      responses:
        '200':
          description: Buyer-visible credit requests.
  /organizations/{organizationID}/credit-requests:
    post:
      operationId: createCreditRequest
      summary: Create a one-time credit request
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditRequestInput'
      responses:
        '201':
          description: Credit request created.
    get:
      operationId: listCreditRequests
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: Credit requests.
  /organizations/{organizationID}/credit-requests/{requestID}:
    get:
      operationId: getSupplierCreditRequest
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Complete supplier-visible credit request and evidence timeline.
    patch:
      operationId: updateDraftCreditRequest
      summary: Amend a draft before an immutable agreement version is created
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditDraftUpdate'
      responses:
        '200':
          description: Draft terms updated with optimistic version checking.
  /organizations/{organizationID}/credit-requests/{requestID}/send:
    post:
      operationId: sendCreditRequest
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Agreement version created and request sent.
  /organizations/{organizationID}/credit-requests/{requestID}/cancel:
    post:
      operationId: cancelCreditRequest
      summary: Cancel an unaccepted credit request
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Request cancelled without deleting its history.
  /organizations/{organizationID}/credit-requests/{requestID}/release:
    post:
      operationId: releaseGoods
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Goods release evidence recorded.
  /buyer/credit-requests/{requestID}:
    get:
      operationId: getBuyerCreditRequest
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Buyer credit review.
  /buyer/credit-requests/{requestID}/agreement:
    get:
      operationId: getBuyerAgreement
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Immutable agreement version presented to the buyer.
  /buyer/credit-requests/{requestID}/agreement-document:
    get:
      operationId: getBuyerAgreementDocument
      summary: Render the activated agreement as a printable document
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Printable immutable agreement and activation evidence.
          content:
            text/html:
              schema: {type: string}
        '409':
          description: Agreement has not activated or its evidence is incomplete.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /buyer/credit-requests/{requestID}/mandate:
    post:
      operationId: authorizeCreditMandate
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Mandate authorized.
  /buyer/credit-requests/{requestID}/accept:
    post:
      operationId: acceptCreditRequest
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditAcceptRequest'
      responses:
        '200':
          description: Credit agreement accepted.
  /buyer/credit-requests/{requestID}/decline:
    post:
      operationId: declineCreditRequest
      summary: Decline a credit request before acceptance
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Request declined and retained as factual history.
  /buyer/credit-requests/{requestID}/receipt:
    post:
      operationId: recordReceipt
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Receipt confirmation recorded; confirmed receipts activate the obligation.
  /organizations/{organizationID}/credit-requests/{requestID}/payments:
    post:
      operationId: recordPayment
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: Payment recognized and allocated.
    get:
      operationId: listPayments
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Payment history and authoritative cached outstanding amount.
  /organizations/{organizationID}/credit-requests/{requestID}/payments/{paymentID}/reverse:
    post:
      operationId: reversePayment
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/PaymentID'
      responses:
        '200':
          description: Reversal event recorded.
  /organizations/{organizationID}/credit-requests/{requestID}/reconciliation:
    get:
      operationId: reconcilePayments
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Rebuilt outstanding balance and related ledger transactions.
  /organizations/{organizationID}/credit-requests/{requestID}/agreement-document:
    get:
      operationId: getSupplierAgreementDocument
      summary: Render the activated agreement as a printable document
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Printable immutable agreement and activation evidence.
          content:
            text/html:
              schema: {type: string}
        '409':
          description: Agreement has not activated or its evidence is incomplete.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /buyer/credit-requests/{requestID}/payments:
    get:
      operationId: listBuyerPayments
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Buyer-visible factual payment history.
  /buyer/obligations/{obligationID}:
    get:
      operationId: getBuyerObligation
      summary: Get the complete buyer-visible obligation statement projection
      parameters:
        - name: obligationID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Obligation, schedule, payments, disputes, and payment claims.}
        '404': {description: Obligation not found for the current buyer.}
  /buyer/credit-requests/{requestID}/payment-claims:
    post:
      operationId: createBuyerPaymentClaim
      summary: Claim an off-platform payment and create a bounded collection hold
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentClaimInput'
      responses:
        '201':
          description: Payment claim opened for supplier review.
        '409':
          description: Feature disabled, invalid amount, or ineligible obligation.
  /buyer/mandates/{mandateID}/cancel:
    post:
      operationId: cancelBuyerMandate
      summary: Cancel a mandate and suspend dependent collection authority
      parameters:
        - name: mandateID
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200': {description: Mandate cancelled and dependent resources suspended.}
  /buyer/mandates/{mandateID}/restore:
    post:
      operationId: restoreBuyerMandate
      summary: Start a fresh authorization for an inactive mandate
      parameters:
        - name: mandateID
          in: path
          required: true
          schema: {type: string}
