groups:
  - name: kredit-api
    rules:
      - alert: KreditAPIUnavailable
        expr: up{job="kredit-api"} == 0 or absent(up{job="kredit-api"})
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Kredit API or its scrape target is unavailable"}
      - alert: KreditHighServerErrorRate
        expr: sum(rate(kredit_http_responses_5xx[5m])) / clamp_min(sum(rate(kredit_http_requests_total[5m])), 0.001) > 0.01
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "API 5xx rate is above 1%"}
      - alert: KreditHighRequestLatency
        expr: kredit_http_request_duration_milliseconds{quantile="0.95"} > 1000
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "API bounded-sample p95 latency is above one second"}
  - name: kredit-financial
    rules:
      # These are current-state gauges, not counters. Never apply rate/increase
      # to them. Deployment labels must separate independent environments.
      - alert: KreditFinancialTelemetryMissing
        expr: absent(kredit_ledger_discrepancies) or absent(kredit_balance_discrepancies) or absent(kredit_schedule_discrepancies) or absent(kredit_collection_payment_discrepancies) or absent(kredit_settlement_discrepancies) or absent(kredit_provider_webhook_oldest_unprocessed_seconds) or absent(kredit_collection_unknown_states) or absent(kredit_notification_dead_letters) or absent(kredit_outbox_delivery_failures) or absent(kredit_collection_oldest_unresolved_seconds) or absent(kredit_river_pending_jobs) or absent(kredit_river_discarded_jobs) or absent(kredit_active_obligations) or absent(kredit_negative_outstanding_balances) or absent(kredit_financial_reviews_open) or absent(kredit_financial_reviews_unassigned) or absent(kredit_financial_review_oldest_open_seconds) or absent(kredit_drawdown_receipt_issues_open) or absent(kredit_drawdown_receipt_issue_oldest_open_seconds)
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Required financial monitoring signals are missing"}
      - alert: KreditLedgerReconciliationFailure
        expr: kredit_ledger_discrepancies > 0
        labels: {severity: critical}
        annotations: {summary: "Ledger reconciliation failed; investigate before further financial writes"}
      - alert: KreditNegativeOutstandingBalance
        expr: kredit_negative_outstanding_balances > 0
        labels: {severity: critical}
        annotations: {summary: "A negative outstanding balance requires immediate investigation"}
      - alert: KreditProviderWebhookBacklog
        expr: kredit_provider_webhook_oldest_unprocessed_seconds > 300
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Provider webhook processing is delayed"}
      - alert: KreditCollectionUnknownState
        expr: kredit_collection_unknown_states > 0
        labels: {severity: critical}
        annotations: {summary: "A collection outcome is unknown; reconcile before retrying"}
      - alert: KreditCollectionReconciliationStale
        expr: kredit_collection_oldest_unresolved_seconds > 900
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "An unresolved collection is older than fifteen minutes"}
      - alert: KreditNotificationDeadLetters
        expr: kredit_notification_dead_letters > 0
        labels: {severity: warning}
        annotations: {summary: "Critical notification delivery exhausted its retry budget"}
      - alert: KreditFinancialProjectionMismatch
        expr: kredit_balance_discrepancies > 0 or kredit_schedule_discrepancies > 0 or kredit_collection_payment_discrepancies > 0 or kredit_settlement_discrepancies > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Financial records disagree; review reconciliation cases"}
      - alert: KreditOutboxDeliveryFailure
        expr: kredit_outbox_delivery_failures > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "A committed financial event repeatedly failed delivery"}
      - alert: KreditRiverQueueBacklogHigh
        expr: kredit_river_pending_jobs > 50
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "More than fifty due background jobs remain queued"}
      - alert: KreditRiverDeadLetters
        expr: kredit_river_discarded_jobs > 0
        labels: {severity: critical}
        annotations: {summary: "A discarded background job requires an assigned operator"}
      - alert: KreditFinancialReviewUnassigned
        expr: kredit_financial_reviews_unassigned > 0
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "Financial differences need an accountable reviewer"
          description: "Open /admin/reconciliation and claim the case. Use docs/runbooks/recovery-operations.md; do not retry collections or change balances to clear this alert."
      - alert: KreditFinancialReviewAging
        expr: kredit_financial_review_oldest_open_seconds > 3600
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "An open financial review is older than one hour"
          description: "Escalate to financial operations with the case reference and investigation history. Closing requires the underlying records to agree."
      - alert: KreditDeliveryIssueAging
        expr: kredit_drawdown_receipt_issue_oldest_open_seconds > 86400
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "A reported delivery problem is older than one day"
          description: "Contact the responsible seller and buyer through the support process. Only buyer confirmation or seller acceptance of a return resolves the purchase; see docs/runbooks/recovery-operations.md."
