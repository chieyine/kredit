name: Phase 3 Final Staticcheck Cleanup

on:
  push:
    branches: [phase3-financial-proof]
    paths: ['.github/workflows/phase3-lint-cleanup-final.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Apply final staticcheck cleanup
        run: |
          python3 scripts/phase3_lint_cleanup_final.py
          gofmt -w internal/collections/sweep_postgres_test.go
          go test ./internal/collections
      - name: Commit verified code-only cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/collections/sweep_postgres_test.go
          git diff --cached --check
          git commit -m 'phase3: finish staticcheck cleanup'
          git push
