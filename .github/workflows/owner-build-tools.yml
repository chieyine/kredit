name: Owner compiler dependencies (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  tools:
    if: github.repository == 'chieyine/kredit' && github.event.pull_request.number == 15 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Export compiler and public module dependencies only
        run: |
          set -euo pipefail
          go mod download
          mkdir -p /tmp/kredit-tooling
          cp -a "$(go env GOROOT)" /tmp/kredit-tooling/go
          mkdir -p /tmp/kredit-tooling/mod
          cp -a "$(go env GOMODCACHE)/." /tmp/kredit-tooling/mod/
          tar -C /tmp/kredit-tooling -czf /tmp/kredit-go-tooling.tgz go mod
      - uses: actions/upload-artifact@v4
        with:
          name: owner-go-tooling
          path: /tmp/kredit-go-tooling.tgz
          retention-days: 1
