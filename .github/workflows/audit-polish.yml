name: Apply final reviewed audit corrections (one use)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  apply:
    if: >-
      github.repository == 'chieyine/kredit' &&
      github.event.pull_request.number == 14 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'improvement/audit-2026-09-06'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply verified corrections only to the audit branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/improvement/audit-2026-09-06 | cut -f1)" = "$EXPECTED_HEAD"
          python3 .audit-polish.py
          git diff --cached --check
          git config user.name 'Kredit maintenance'
          git config user.email 'kredit-maintenance@users.noreply.github.com'
          git commit -m 'fix: close full-suite regressions and verify isolated legal activation'
          git push origin HEAD:refs/heads/improvement/audit-2026-09-06
