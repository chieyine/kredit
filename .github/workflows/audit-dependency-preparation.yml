name: Audit dependency patch preparation

on:
  pull_request:
    paths: [.github/workflows/audit-dependency-preparation.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: .go-version
          cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Prepare only the identified patched dependency versions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependency-review"
          git rev-parse HEAD > "$RUNNER_TEMP/dependency-review/source-commit.txt"
          go get go.opentelemetry.io/otel@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel/trace@v1.45.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 google.golang.org/grpc@v1.83.2
          go mod tidy
          printf "\n  # GHSA-9rgm-9g3h-6x36: reject malformed devalue input.\n  'devalue@<5.9.2': 5.9.2\n" >> pnpm-workspace.yaml
          pnpm install --lockfile-only --ignore-scripts
          git diff --check
          cp go.mod go.sum pnpm-workspace.yaml pnpm-lock.yaml "$RUNNER_TEMP/dependency-review/"
          git diff --binary -- go.mod go.sum pnpm-workspace.yaml pnpm-lock.yaml > "$RUNNER_TEMP/dependency-review/dependency.patch"
          sha256sum go.mod go.sum pnpm-workspace.yaml pnpm-lock.yaml > "$RUNNER_TEMP/dependency-review/SHA256SUMS"
      - name: Test the proposed dependency graph without database or provider writes
        run: |
          set -euo pipefail
          go mod verify
          go test ./... 2>&1 | tee "$RUNNER_TEMP/dependency-review/go-tests.log"
          pnpm install --frozen-lockfile
          pnpm --dir web check 2>&1 | tee "$RUNNER_TEMP/dependency-review/web-check.log"
          pnpm --dir web build 2>&1 | tee "$RUNNER_TEMP/dependency-review/web-build.log"
      - name: Preserve proposed files for source review, never commit or update refs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-review-${{ github.sha }}
          path: ${{ runner.temp }}/dependency-review/
          retention-days: 7
          if-no-files-found: error
