name: Phase 6 Status Sync

on:
  push:
    branches: [phase6-hardening-polish]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-hardening-polish
      - name: Synchronize implementation status
        run: python3 scripts/phase6-status-sync.py
      - name: Remove temporary patch harness
        run: rm scripts/phase6-status-sync.py .github/workflows/phase6-status-sync.yml
      - name: Commit status synchronization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "phase6: synchronize implementation status with migrations 086"
          git push origin HEAD:phase6-hardening-polish
