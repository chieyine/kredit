name: Phase 2 Final Runtime Patch

on:
  push:
    branches: [phase2-tenant-isolation]
    paths: ['.github/workflows/phase2-final-runtime-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Apply final fail-closed runtime patch
        run: |
          python3 scripts/phase2_final_runtime_patch.py
          gofmt -w internal/web/collection_jobs.go internal/web/credit_handlers.go
          go test ./internal/web ./internal/collections ./internal/jobs ./cmd/worker
      - name: Commit verified patch and remove temporary tooling
        run: |
          rm scripts/phase2_final_runtime_patch.py
          rm .github/workflows/phase2-final-runtime-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'phase2: fail closed on missing collection tenant'
          git push
