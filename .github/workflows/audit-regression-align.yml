name: Align audit regressions (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: audit-alignment-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'chieyine/kredit' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'improvement/audit-2026-09-06'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: |
          set -euo pipefail
          if grep -q 'both sale-creation entry points preserve' web/tests/product-quality.spec.ts; then exit 0; fi
          python3 scripts/audit-align-regressions.py
          git diff --check
          git config user.name 'Kredit maintenance'
          git config user.email 'kredit-maintenance@users.noreply.github.com'
          while IFS= read -r path; do git add -- "$path"; done < .tmp/regression-paths.txt
          git commit -m 'test: align existing behavioural regressions with reviewed product journeys'
          git push origin HEAD:refs/heads/improvement/audit-2026-09-06
