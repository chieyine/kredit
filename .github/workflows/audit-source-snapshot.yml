name: Audit source snapshot (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  source:
    if: >-
      github.repository == 'chieyine/kredit' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'improvement/audit-2026-09-06'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Export tracked source only
        run: |
          git archive --format=zip --output=/tmp/kredit-audit-completion-source.zip HEAD
          git rev-parse HEAD > /tmp/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: audit-completion-source
          path: |
            /tmp/kredit-audit-completion-source.zip
            /tmp/source-commit.txt
          retention-days: 1
