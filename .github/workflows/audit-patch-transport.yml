name: Prepare reviewed worker predicate fix
on:
  push:
    branches: [audit/2026-09-20-integrity-remediation]
    paths: [.github/workflows/audit-patch-transport.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'chieyine/kredit' && github.ref == 'refs/heads/audit/2026-09-20-integrity-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify patch and upload two reviewed source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          packed = ''
          patch = lzma.decompress(base64.b64decode(packed, validate=True))
          if hashlib.sha256(patch).hexdigest() != 'd2a1535543c0857c9b8ac3b7cb1e01a33b6d98589ad86734535ce203018a2f89':
              raise SystemExit('Patch checksum mismatch')
          subprocess.run(['git','apply','--check','--index','-'], input=patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=patch, check=True)
          expected = {'db/migrations/201_audit_order_import_integrity.sql','infra/postgres/roles.sql'}
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          if changed != expected:
              raise SystemExit('Unexpected changed paths')
          for name in sorted(changed):
              req = urllib.request.Request('https://api.github.com/repos/chieyine/kredit/git/blobs', data=json.dumps({'content':base64.b64encode(pathlib.Path(name).read_bytes()).decode(),'encoding':'base64'}).encode(), method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  print(name, json.load(response)['sha'])
          # No branch/ref update, commit, merge or deployment.
          PY
