name: Prepare reviewed audit follow-up
on:
  push:
    branches: [audit/2026-09-20-integrity-remediation]
    paths: [.audit-transport/**, .github/workflows/audit-patch-transport.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'chieyine/kredit' && github.ref == 'refs/heads/audit/2026-09-20-integrity-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and upload reviewed source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          patch = lzma.decompress(base64.b64decode(pathlib.Path('.audit-transport/followup.b64').read_text(), validate=True))
          digest = '38dae28098e2ef508d094af71f13c339eb306b08bb37233b72681523e369c891'
          if hashlib.sha256(patch).hexdigest() != digest:
              raise SystemExit('Reviewed patch checksum mismatch')
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          entries = []
          for name in filter(None, names):
              path = pathlib.Path(name)
              if path.is_absolute() or '..' in path.parts or path.is_symlink():
                  raise SystemExit('Invalid source path')
              content = base64.b64encode(path.read_bytes()).decode()
              req = urllib.request.Request('https://api.github.com/repos/chieyine/kredit/git/blobs', data=json.dumps({'content':content,'encoding':'base64'}).encode(), method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  blob = json.load(response)
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          print('VERIFIED_PATCH_SHA256=' + digest)
          print('UPLOADED_BLOBS=' + json.dumps(entries))
          # No ref update, commit, merge, test execution or deployment here.
          PY
