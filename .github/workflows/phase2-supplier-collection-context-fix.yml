name: Phase 2 Supplier Collection Context Fix

on:
  push:
    branches: [phase2-tenant-isolation]
    paths: ['.github/workflows/phase2-supplier-collection-context-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Apply and verify tenant-context patch
        run: |
          python3 scripts/phase2_supplier_collection_context_patch.py
          gofmt -w internal/web/financial_reads.go internal/web/credit_handlers.go
          go test ./internal/web ./internal/collections ./internal/db ./internal/payments
      - name: Commit verified fix and remove temporary tooling
        run: |
          rm scripts/phase2_supplier_collection_context_patch.py
          rm .github/workflows/phase2-supplier-collection-context-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'phase2: tenant-scope supplier collection endpoints'
          git push
