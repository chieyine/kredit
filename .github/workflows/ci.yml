name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kredit
          POSTGRES_PASSWORD: kredit
          POSTGRES_DB: kredit_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U kredit -d kredit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned OpenAPI linter
        run: npm install --global @redocly/cli@2.51.2
      - name: Install checksum-pinned Go linter binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          archive=golangci-lint-2.13.2-linux-amd64.tar.gz
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          # Digest from the upstream immutable v2.13.2 GitHub release asset.
          # Do not compile the linter through the application's module cache.
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            "https://github.com/golangci/golangci-lint/releases/download/v2.13.2/$archive" \
            --output "$download_dir/$archive"
          printf '%s  %s\n' \
            2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6 \
            "$download_dir/$archive" | sha256sum --check --strict
          tar --extract --gzip --no-same-owner --no-same-permissions \
            --file "$download_dir/$archive" --directory "$download_dir" \
            golangci-lint-2.13.2-linux-amd64/golangci-lint
          tools="$RUNNER_TEMP/kredit-analysis-bin"
          mkdir -p "$tools"
          install -m 0755 "$download_dir/golangci-lint-2.13.2-linux-amd64/golangci-lint" "$tools/golangci-lint"
          test "$(od -An -tx1 -N4 "$tools/golangci-lint" | tr -d ' \n')" = 7f454c46
          GOPROXY=off GOTOOLCHAIN=local "$tools/golangci-lint" version
          printf '%s\n' "$tools" >> "$GITHUB_PATH"
      - name: Install required Go analysis tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0
      - uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.74.0
          cache: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Apply fresh database migrations and runtime roles
        env:
          DATABASE_URL: postgres://kredit:kredit@127.0.0.1:5432/kredit_test?sslmode=disable
        run: |
          go run ./cmd/migrate
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f infra/postgres/roles.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -v app_login_password=kredit-app-development-only \
            -v worker_login_password=kredit-worker-development-only \
            -v backup_login_password=kredit-backup-development-only \
            -v demote_owner=false \
            -f infra/postgres/development-logins.sql
      - name: Run repository checks
        env:
          GOCACHE: ${{ runner.temp }}/go-cache
          CI_REQUIRE_DATABASE: "1"
          SECURITY_STRICT: "1"
          OPENAPI_LINT_STRICT: "1"
          REDOCLY_TELEMETRY: "off"
          REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
          DATABASE_URL: postgres://kredit:kredit@127.0.0.1:5432/kredit_test?sslmode=disable
          DATABASE_DIRECT_URL: postgres://kredit:kredit@127.0.0.1:5432/kredit_test?sslmode=disable
          APP_DATABASE_URL: postgres://kredit_app_login:kredit-app-development-only@127.0.0.1:5432/kredit_test?sslmode=disable
          RIVER_DATABASE_URL: postgres://kredit_worker_login:kredit-worker-development-only@127.0.0.1:5432/kredit_test?sslmode=disable
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/kredit-analysis-bin:$PATH"
          hash -r
          test "$(command -v golangci-lint)" = "$RUNNER_TEMP/kredit-analysis-bin/golangci-lint"
          test "$(od -An -tx1 -N4 "$(command -v golangci-lint)" | tr -d ' \n')" = 7f454c46
          bash scripts/ci.sh
      - name: Build platform-neutral containers
        run: |
          docker build -f infra/containers/Dockerfile.api --target api -t kredit-api:${{ github.sha }} .
          docker build -f infra/containers/Dockerfile.api --target worker -t kredit-worker:${{ github.sha }} .
          docker build -f infra/containers/Dockerfile.web -t kredit-web:${{ github.sha }} .
      - name: Preserve synthetic regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence-${{ github.sha }}
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
