name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kredit
          POSTGRES_PASSWORD: kredit
          POSTGRES_DB: kredit_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U kredit -d kredit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install required Go analysis tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
      - uses: aquasecurity/setup-trivy@v0.2.3
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Apply fresh database migrations
        env:
          DATABASE_URL: postgres://kredit:kredit@127.0.0.1:5432/kredit_test?sslmode=disable
        run: go run ./cmd/migrate
      - name: Run repository checks
        env:
          GOCACHE: ${{ runner.temp }}/go-cache
          SECURITY_STRICT: "1"
          DATABASE_URL: postgres://kredit:kredit@127.0.0.1:5432/kredit_test?sslmode=disable
        run: bash scripts/ci.sh
      - name: Build platform-neutral containers
        run: |
          docker build -f infra/containers/Dockerfile.api --target api -t kredit-api:${{ github.sha }} .
          docker build -f infra/containers/Dockerfile.api --target worker -t kredit-worker:${{ github.sha }} .
          docker build -f infra/containers/Dockerfile.web -t kredit-web:${{ github.sha }} .
