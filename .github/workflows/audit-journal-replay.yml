name: Audit payment journal replay

on:
  push:
    branches: [audit/2026-09-20-integrity-remediation]
    paths: [.github/workflows/audit-journal-replay.yml]

permissions:
  contents: read

jobs:
  journal-replay:
    if: github.repository == 'chieyine/kredit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kredit
          POSTGRES_PASSWORD: kredit
          POSTGRES_DB: kredit_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U kredit -d kredit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f29af33d11ae085c719caced1436084c3a4b6ff1
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: .go-version
          cache: true
      - name: Prove the regression fails against the original helper
        run: |
          test "$(git rev-parse HEAD)" = f29af33d11ae085c719caced1436084c3a4b6ff1
          go mod download
          set +e
          go test -count=1 -v ./internal/payments -run '^TestAuditJournalReplayRequiresMatchingIntent$' > "$RUNNER_TEMP/journal-baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/journal-baseline.log"
          test "$result" -eq 1
          grep -Fq 'journal replay did not enforce the recorded intent: <nil>' "$RUNNER_TEMP/journal-baseline.log"
          if grep -Fq '[build failed]' "$RUNNER_TEMP/journal-baseline.log"; then exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1883adf40ace1253fd2a9f5bee82904c0a30f518
          persist-credentials: false
      - name: Prepare only the isolated test database
        env:
          DATABASE_URL: postgres://kredit:kredit@127.0.0.1:5432/kredit_test?sslmode=disable
        run: |
          test "$(git rev-parse HEAD)" = 1883adf40ace1253fd2a9f5bee82904c0a30f518
          go run ./cmd/migrate
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f infra/postgres/roles.sql
      - name: Verify exact replay and atomic rejection against PostgreSQL
        env:
          KREDIT_INTEGRATION: "1"
          DATABASE_URL: postgres://kredit:kredit@127.0.0.1:5432/kredit_test?sslmode=disable
        run: |
          set -euo pipefail
          go test -count=1 -race -v ./internal/payments -run '^TestAudit(JournalReplay|PaymentRejects)' 2>&1 | tee "$RUNNER_TEMP/journal-regression.log"
      - name: Run payment package regression tests
        env:
          KREDIT_INTEGRATION: "1"
          DATABASE_URL: postgres://kredit:kredit@127.0.0.1:5432/kredit_test?sslmode=disable
        run: |
          set -euo pipefail
          go test -count=1 -race -v ./internal/payments 2>&1 | tee "$RUNNER_TEMP/payment-package.log"
      - name: Preserve the checked source identity
        if: always()
        run: git rev-parse HEAD > "$RUNNER_TEMP/journal-source.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: payment-journal-replay-1883adf
          path: |
            ${{ runner.temp }}/journal-baseline.log
            ${{ runner.temp }}/journal-regression.log
            ${{ runner.temp }}/payment-package.log
            ${{ runner.temp }}/journal-source.txt
          retention-days: 7
          if-no-files-found: error
