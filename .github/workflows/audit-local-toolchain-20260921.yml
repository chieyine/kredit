name: Audit offline Go tools (temporary)
on:
  push:
    branches: [audit/2026-09-20-integrity-remediation]
    paths: [.github/workflows/audit-local-toolchain-20260921.yml]
permissions:
  contents: read
jobs:
  tools:
    if: github.repository == 'chieyine/kredit' && github.ref == 'refs/heads/audit/2026-09-20-integrity-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0c972e61f085311532e7d58940c18781817e25da
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: .go-version
          cache: false
      - name: Download and verify the repository's public dependency graph
        run: |
          go mod download
          go mod verify
          mkdir -p "$RUNNER_TEMP/offline"
          cp -a "$(go env GOROOT)" "$RUNNER_TEMP/offline/go"
          cp -a "$(go env GOMODCACHE)" "$RUNNER_TEMP/offline/modcache"
          go version > "$RUNNER_TEMP/offline/toolchain.txt"
          cp go.mod go.sum "$RUNNER_TEMP/offline/"
          tar -C "$RUNNER_TEMP/offline" -czf "$RUNNER_TEMP/offline-go.tar.gz" go modcache toolchain.txt go.mod go.sum
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-offline-go-0c972e6
          path: ${{ runner.temp }}/offline-go.tar.gz
          retention-days: 1
          if-no-files-found: error
