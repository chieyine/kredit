name: Apply reviewed audit patch (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: apply-reviewed-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'chieyine/kredit' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'improvement/audit-2026-09-06'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply only the pinned, reviewed source transformations
        run: |
          set -euo pipefail
          if test -f docs/testing/audit-2026-09-06-implementation.md || ! test -f scripts/apply-reviewed-audit.py; then
            echo 'No pending materialisation; snapshot source for isolated review.'
            exit 0
          fi
          python3 scripts/apply-reviewed-audit.py
          git diff --check
          git config user.name 'Kredit maintenance'
          git config user.email 'kredit-maintenance@users.noreply.github.com'
          while IFS= read -r path; do git add -- "$path"; done < .tmp/audit-changed-paths.txt
          git commit -m 'fix: implement reviewed reliability, consent and product-quality audit'
          git push origin HEAD:refs/heads/improvement/audit-2026-09-06
      - name: Export source without Git credentials or runtime data
        run: git archive --format=zip --output=/tmp/kredit-audit-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: kredit-audit-source
          path: /tmp/kredit-audit-source.zip
          retention-days: 1
