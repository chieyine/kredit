name: Audit full database behaviour

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: audit-behaviour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kredit
          POSTGRES_PASSWORD: kredit
          POSTGRES_DB: kredit_audit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kredit -d kredit_audit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kredit:kredit@127.0.0.1:5432/kredit_audit_test?sslmode=disable
      DATABASE_DIRECT_URL: postgres://kredit:kredit@127.0.0.1:5432/kredit_audit_test?sslmode=disable
      APP_DATABASE_URL: postgres://kredit_app_login:kredit-app-development-only@127.0.0.1:5432/kredit_audit_test?sslmode=disable
      RIVER_DATABASE_URL: postgres://kredit_worker_login:kredit-worker-development-only@127.0.0.1:5432/kredit_audit_test?sslmode=disable
      KREDIT_NATIVE_TEST_DB: postgres://kredit:kredit@127.0.0.1:5432/kredit_native_audit?sslmode=disable
      CI_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: .go-version
          cache: true
      - name: Prepare isolated PostgreSQL and restricted test logins
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/database-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/database-audit/source-commit.txt"
          go run ./cmd/migrate
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f infra/postgres/roles.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -v app_login_password=kredit-app-development-only \
            -v worker_login_password=kredit-worker-development-only \
            -v backup_login_password=kredit-backup-development-only \
            -v demote_owner=false -f infra/postgres/development-logins.sql
          # Native-provider tests deliberately refuse every other database name.
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE kredit_native_audit'
          DATABASE_DIRECT_URL="$KREDIT_NATIVE_TEST_DB" go run ./cmd/migrate
          psql "$KREDIT_NATIVE_TEST_DB" -X -v ON_ERROR_STOP=1 -f infra/postgres/roles.sql
      - name: Execute all database integration packages
        run: |
          set -euo pipefail
          bash scripts/test-integration.sh 2>&1 | tee "$RUNNER_TEMP/database-audit/integration.log"
      - name: Check field-level inventory against the actual schema
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash scripts/data-inventory-check.sh 2>&1 | tee "$RUNNER_TEMP/database-audit/inventory.log"
      - name: Check row-security policy shape independently
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash scripts/rls-policy-shape-check.sh 2>&1 | tee "$RUNNER_TEMP/database-audit/rls-shape.log"
      - name: Preserve actual schema for reviewing missing inventory entries
        if: ${{ !cancelled() }}
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -A -F $'\t' -t -c "SELECT c.table_schema,c.table_name,c.column_name,c.data_type FROM information_schema.columns c JOIN information_schema.tables t USING(table_schema,table_name) WHERE t.table_type='BASE TABLE' AND c.table_schema IN ('app','ledger','river','jobs') ORDER BY 1,2,c.ordinal_position" > "$RUNNER_TEMP/database-audit/schema.tsv"
      - name: Preserve completed test and policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-integration-${{ github.sha }}
          path: ${{ runner.temp }}/database-audit/
          retention-days: 7
          if-no-files-found: ignore
