name: Phase 2 Runtime Patch

on:
  push:
    branches: [phase2-tenant-isolation]
    paths: ['.github/workflows/phase2-runtime-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Wire authoritative tenant context into payment runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          def patch_function(text, name, old, new):
              start_marker = f'func (s *Server) {name}('
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'handler {name} not found')
              next_start = text.find('\nfunc (s *Server) ', start + len(start_marker))
              if next_start < 0:
                  next_start = len(text)
              body = text[start:next_start]
              if body.count(old) != 1:
                  raise SystemExit(f'{name}: expected one scoped anchor, found {body.count(old)}')
              body = body.replace(old, new, 1)
              return text[:start] + body + text[next_start:]

          p = Path('internal/payments/postgres.go')
          text = p.read_text()
          old = '''\tif existing, allocation, found, err := loadByIdempotency(ctx, tx, input.IdempotencyKey); err != nil {
          \t\treturn Payment{}, Allocation{}, err
          \t} else if found {
          \t\tif !samePaymentIntent(existing, input) {
          \t\t\treturn Payment{}, Allocation{}, errors.New("idempotency key was reused for a different payment")
          \t\t}
          \t\treturn existing, allocation, nil
          \t}

          \t// Establish the persisted parties before reading tenant-scoped credit rows.
          \t// A collection worker has no browser session; relying on session-local
          \t// database context would make autonomous repayments disappear under RLS.
          \tvar buyerContext, supplierContext string
          \tif err := tx.QueryRow(ctx, `SELECT s.buyer_user_id,s.supplier_organization_id FROM app.credit_aggregate_snapshots s JOIN app.obligations o ON o.credit_request_id::text=s.credit_request_id WHERE o.id=$1::uuid`, input.ObligationID).Scan(&buyerContext, &supplierContext); err != nil {
          \t\treturn Payment{}, Allocation{}, errors.New("obligation context not found")
          \t}
          \tif _, err := tx.Exec(ctx, `SELECT set_config('app.current_user_id',$1,true),set_config('app.current_organization_id',$2,true)`, buyerContext, supplierContext); err != nil {
          \t\treturn Payment{}, Allocation{}, err
          \t}
          '''
          new = '''\t// Tenant identity must come from an authenticated HTTP boundary or a
          \t// tenant-scoped worker job, never from the obligation being requested.
          \tif err := db.SetObligationContext(ctx, tx, input.ObligationID); err != nil {
          \t\treturn Payment{}, Allocation{}, err
          \t}
          \tif existing, allocation, found, err := loadByIdempotency(ctx, tx, input.IdempotencyKey); err != nil {
          \t\treturn Payment{}, Allocation{}, err
          \t} else if found {
          \t\tif !samePaymentIntent(existing, input) {
          \t\t\treturn Payment{}, Allocation{}, errors.New("idempotency key was reused for a different payment")
          \t\t}
          \t\treturn existing, allocation, nil
          \t}

          '''
          text = replace_once(text, old, new, 'RecordTx tenant context')

          old = '''\tpayment, err := loadPayment(ctx, tx, paymentID, true)
          \tif err != nil {
          \t\treturn Payment{}, err
          \t}
          \tif payment.State == StateReversed {
          \t\treturn payment, nil
          \t}
          \tif err := db.SetObligationContext(ctx, tx, payment.ObligationID); err != nil {
          \t\treturn Payment{}, err
          \t}
          '''
          new = '''\tif err := db.SetTenantContext(ctx, tx); err != nil {
          \t\treturn Payment{}, err
          \t}
          \tpayment, err := loadPayment(ctx, tx, paymentID, true)
          \tif err != nil {
          \t\treturn Payment{}, err
          \t}
          \tif payment.State == StateReversed {
          \t\treturn payment, nil
          \t}
          '''
          text = replace_once(text, old, new, 'ReverseContext tenant context')

          text = replace_once(text,
              '\treturn loadPayment(ctx, s.pool, paymentID, false)\n',
              '''\ttx, err := s.pool.Begin(ctx)
          \tif err != nil {
          \t\treturn Payment{}, err
          \t}
          \tdefer func() { _ = tx.Rollback(ctx) }()
          \tif err := db.SetTenantContext(ctx, tx); err != nil {
          \t\treturn Payment{}, err
          \t}
          \treturn loadPayment(ctx, tx, paymentID, false)
          ''', 'GetContext tenant context')

          text = replace_once(text,
              '''\trows, err := s.pool.Query(ctx, paymentSelect+` WHERE p.obligation_id=$1::uuid ORDER BY p.recognized_at,p.id`, obligationID)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          ''',
              '''\ttx, err := s.pool.Begin(ctx)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tdefer func() { _ = tx.Rollback(ctx) }()
          \tif err := db.SetTenantContext(ctx, tx); err != nil {
          \t\treturn nil, err
          \t}
          \trows, err := tx.Query(ctx, paymentSelect+` WHERE p.obligation_id=$1::uuid ORDER BY p.recognized_at,p.id`, obligationID)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          ''', 'ReadContext tenant context')
          p.write_text(text)

          p = Path('internal/web/credit_handlers.go')
          text = p.read_text()
          import_anchor = '\t"kredit/internal/credit"\n'
          if '\t"kredit/internal/db"\n' not in text:
              text = replace_once(text, import_anchor, import_anchor + '\t"kredit/internal/db"\n', 'db import')

          manage = '''\t_, user, _, ok := s.requireOrganizationAccess(w, r, orgID, access.PermissionManageFinancial)
          \tif !ok {
          \t\treturn
          \t}
          '''
          manage_ctx = manage + '\tr = r.WithContext(db.WithTenantContext(r.Context(), user.ID, orgID))\n'
          for name in ('recordPayment', 'reversePayment'):
              text = patch_function(text, name, manage, manage_ctx)

          read = '''\tif _, _, _, ok := s.requireOrganizationAccess(w, r, orgID, access.PermissionReadFinancial); !ok {
          \t\treturn
          \t}
          '''
          read_ctx = read + '\tr = r.WithContext(db.WithTenantContext(r.Context(), "", orgID))\n'
          for name in ('listPayments', 'reconcilePayments'):
              text = patch_function(text, name, read, read_ctx)

          auth = '''\t_, user, ok := s.requireAuth(w, r)
          \tif !ok {
          \t\treturn
          \t}
          '''
          auth_ctx = auth + '\tr = r.WithContext(db.WithTenantContext(r.Context(), user.ID, ""))\n'
          for name in ('listBuyerPayments', 'getBuyerObligation'):
              text = patch_function(text, name, auth, auth_ctx)
          p.write_text(text)
          PY
          gofmt -w internal/db/tenant_context.go internal/db/financial_context.go internal/payments/postgres.go internal/web/credit_handlers.go
          go test ./internal/db ./internal/payments ./internal/web
      - name: Commit runtime wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/db internal/payments/postgres.go internal/web/credit_handlers.go
          git diff --cached --check
          git commit -m 'phase2: wire authoritative tenant context'
          git push
