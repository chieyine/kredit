name: Phase 2 Runtime Patch

on:
  push:
    branches: [phase2-tenant-isolation]
    paths: ['.github/workflows/phase2-runtime-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Wire tenant-scoped collection worker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # jobs: carry the authoritative supplier organization in collection jobs.
          p = Path('internal/jobs/client.go')
          text = p.read_text()
          text = one(text,
          '''type CollectionArgs struct {
          \tOperation  string `json:"operation"`
          \tResourceID string `json:"resource_id"`
          }
          ''',
          '''type CollectionArgs struct {
          \tOperation      string `json:"operation"`
          \tResourceID     string `json:"resource_id"`
          \tOrganizationID string `json:"organization_id,omitempty"`
          }
          ''', 'CollectionArgs')
          text = one(text,
          '''type OperationHandler func(context.Context, string, string) error

          type Handlers struct {
          \tProviderWebhook func(context.Context, ProviderWebhookArgs) error
          \tCollection      OperationHandler
          ''',
          '''type OperationHandler func(context.Context, string, string) error
          type CollectionHandler func(context.Context, CollectionArgs) error

          type Handlers struct {
          \tProviderWebhook func(context.Context, ProviderWebhookArgs) error
          \tCollection      CollectionHandler
          ''', 'CollectionHandler type')
          text = one(text,
          '''type CollectionWorker struct {
          \triver.WorkerDefaults[CollectionArgs]
          \tHandler OperationHandler
          }

          func (w *CollectionWorker) Work(ctx context.Context, job *river.Job[CollectionArgs]) error {
          \tif w.Handler == nil {
          \t\treturn errors.New("collection operation handler is not configured")
          \t}
          \treturn w.Handler(ctx, job.Args.Operation, job.Args.ResourceID)
          }
          ''',
          '''type CollectionWorker struct {
          \triver.WorkerDefaults[CollectionArgs]
          \tHandler CollectionHandler
          }

          func (w *CollectionWorker) Work(ctx context.Context, job *river.Job[CollectionArgs]) error {
          \tif w.Handler == nil {
          \t\treturn errors.New("collection operation handler is not configured")
          \t}
          \treturn w.Handler(ctx, job.Args)
          }
          ''', 'CollectionWorker')
          p.write_text(text)

          # worker: pass full job identity to the runtime.
          p = Path('cmd/worker/main.go')
          text = p.read_text()
          text = one(text,
          '''\t\tCollection: func(ctx context.Context, operation, resourceID string) error {
          \t\t\treturn runtime.HandleCollectionJob(ctx, cfg, operation, resourceID)
          \t\t},
          ''',
          '''\t\tCollection: func(ctx context.Context, args jobs.CollectionArgs) error {
          \t\t\treturn runtime.HandleCollectionJob(ctx, cfg, args)
          \t\t},
          ''', 'worker collection handler')
          p.write_text(text)

          # collection repository: every aggregate operation establishes normal RLS
          # from the organization carried by the job/request context.
          p = Path('internal/collections/postgres.go')
          text = p.read_text()
          if '"kredit/internal/db"' not in text:
              text = one(text, '"kredit/internal/businesspolicy"\n', '"kredit/internal/businesspolicy"\n\t"kredit/internal/db"\n', 'collections db import')
          text = one(text,
          '''func (e *PostgresEngine) Eligibility(id string, now time.Time) (Eligibility, error) {
          \tlocal, err := e.load(context.Background(), id)
          \tif errors.Is(err, pgx.ErrNoRows) {
          \t\treturn e.base.Eligibility(id, now)
          \t}
          \tif err != nil {
          \t\treturn Eligibility{}, err
          \t}
          \treturn local.Eligibility(id, now)
          }
          ''',
          '''func (e *PostgresEngine) Eligibility(id string, now time.Time) (Eligibility, error) {
          \treturn e.EligibilityContext(context.Background(), id, now)
          }
          func (e *PostgresEngine) EligibilityContext(ctx context.Context, id string, now time.Time) (Eligibility, error) {
          \tlocal, err := e.load(ctx, id)
          \tif errors.Is(err, pgx.ErrNoRows) {
          \t\treturn e.base.Eligibility(id, now)
          \t}
          \tif err != nil {
          \t\treturn Eligibility{}, err
          \t}
          \treturn local.Eligibility(id, now)
          }
          ''', 'EligibilityContext')

          for method, lookup in [('ProcessWebhook','obligationForExternal'), ('SignalWebhook','obligationForExternal')]:
              old = f'''func (e *PostgresEngine) {method}(ctx context.Context, event Webhook) (Attempt, error) {{
          \tid, err := e.{lookup}(ctx, event.ExternalReference)
          \tif err != nil {{
          \t\treturn Attempt{{}}, err
          \t}}
          '''
              new = f'''func (e *PostgresEngine) {method}(ctx context.Context, event Webhook) (Attempt, error) {{
          \tid, organizationID, err := e.{lookup}(ctx, event.ExternalReference)
          \tif err != nil {{
          \t\treturn Attempt{{}}, err
          \t}}
          \tctx = db.WithTenantContext(ctx, "", organizationID)
          '''
              text = one(text, old, new, method)

          for method in ('Reconcile','Retry','Cancel'):
              signature = {
                  'Reconcile': 'func (e *PostgresEngine) Reconcile(ctx context.Context, attemptID string) (Attempt, error) {',
                  'Retry': 'func (e *PostgresEngine) Retry(ctx context.Context, attemptID string, now time.Time) (Attempt, error) {',
                  'Cancel': 'func (e *PostgresEngine) Cancel(ctx context.Context, attemptID string) (Attempt, error) {',
              }[method]
              old = signature + '''
          \tid, err := e.obligationForAttempt(ctx, attemptID)
          \tif err != nil {
          \t\treturn Attempt{}, err
          \t}
          '''
              new = signature + '''
          \tid, organizationID, err := e.obligationForAttempt(ctx, attemptID)
          \tif err != nil {
          \t\treturn Attempt{}, err
          \t}
          \tctx = db.WithTenantContext(ctx, "", organizationID)
          '''
              text = one(text, old, new, method)

          text = one(text,
          '''func (e *PostgresEngine) GetAttempt(attemptID string) (Attempt, bool) {
          \tid, err := e.obligationForAttempt(context.Background(), attemptID)
          \tif err != nil {
          \t\treturn Attempt{}, false
          \t}
          \tlocal, err := e.load(context.Background(), id)
          \tif err != nil {
          \t\treturn Attempt{}, false
          \t}
          \treturn local.GetAttempt(attemptID)
          }
          ''',
          '''func (e *PostgresEngine) GetAttempt(attemptID string) (Attempt, bool) {
          \treturn e.GetAttemptContext(context.Background(), attemptID)
          }
          func (e *PostgresEngine) GetAttemptContext(ctx context.Context, attemptID string) (Attempt, bool) {
          \tid, organizationID, err := e.obligationForAttempt(ctx, attemptID)
          \tif err != nil {
          \t\treturn Attempt{}, false
          \t}
          \tctx = db.WithTenantContext(ctx, "", organizationID)
          \tlocal, err := e.load(ctx, id)
          \tif err != nil {
          \t\treturn Attempt{}, false
          \t}
          \treturn local.GetAttempt(attemptID)
          }
          ''', 'GetAttemptContext')

          text = one(text,
          '''\tdefer func() { _ = tx.Rollback(ctx) }()
          \tpolicy, err := businesspolicy.ReadTx(ctx, tx)
          ''',
          '''\tdefer func() { _ = tx.Rollback(ctx) }()
          \tif err := db.SetObligationContext(ctx, tx, id); err != nil {
          \t\treturn err
          \t}
          \tpolicy, err := businesspolicy.ReadTx(ctx, tx)
          ''', 'mutate tenant context')

          text = one(text,
          '''func (e *PostgresEngine) load(ctx context.Context, id string) (*Engine, error) {
          \tif e == nil || e.pool == nil {
          \t\treturn nil, errors.New("collection database is not configured")
          \t}
          \tvar payload []byte
          \tif err := e.pool.QueryRow(ctx, `SELECT aggregate FROM app.collection_aggregate_snapshots WHERE obligation_id=$1::uuid`, id).Scan(&payload); err != nil {
          \t\treturn nil, err
          \t}
          ''',
          '''func (e *PostgresEngine) load(ctx context.Context, id string) (*Engine, error) {
          \tif e == nil || e.pool == nil {
          \t\treturn nil, errors.New("collection database is not configured")
          \t}
          \ttx, err := e.pool.Begin(ctx)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tdefer func() { _ = tx.Rollback(ctx) }()
          \tif err := db.SetObligationContext(ctx, tx, id); err != nil {
          \t\treturn nil, err
          \t}
          \tvar payload []byte
          \tif err := tx.QueryRow(ctx, `SELECT aggregate FROM app.collection_aggregate_snapshots WHERE obligation_id=$1::uuid`, id).Scan(&payload); err != nil {
          \t\treturn nil, err
          \t}
          ''', 'load tenant context')

          text = one(text,
          '''func (e *PostgresEngine) obligationForAttempt(ctx context.Context, id string) (string, error) {
          \tvar obligation string
          \terr := e.pool.QueryRow(ctx, `SELECT obligation_id::text FROM app.collection_attempt_index WHERE attempt_id=$1::uuid`, id).Scan(&obligation)
          \tif errors.Is(err, pgx.ErrNoRows) {
          \t\treturn "", errors.New("collection attempt not found")
          \t}
          \treturn obligation, err
          }
          func (e *PostgresEngine) obligationForExternal(ctx context.Context, reference string) (string, error) {
          \tvar obligation string
          \terr := e.pool.QueryRow(ctx, `SELECT obligation_id::text FROM app.collection_attempt_index WHERE external_reference=$1`, reference).Scan(&obligation)
          \tif errors.Is(err, pgx.ErrNoRows) {
          \t\treturn "", errors.New("collection attempt not found")
          \t}
          \treturn obligation, err
          }
          ''',
          '''func (e *PostgresEngine) obligationForAttempt(ctx context.Context, id string) (string, string, error) {
          \tvar obligation, organizationID string
          \terr := e.pool.QueryRow(ctx, `SELECT obligation_id::text,organization_id::text FROM app.collection_identity_by_attempt($1::uuid)`, id).Scan(&obligation, &organizationID)
          \tif errors.Is(err, pgx.ErrNoRows) {
          \t\treturn "", "", errors.New("collection attempt not found")
          \t}
          \treturn obligation, organizationID, err
          }
          func (e *PostgresEngine) obligationForExternal(ctx context.Context, reference string) (string, string, error) {
          \tvar obligation, organizationID string
          \terr := e.pool.QueryRow(ctx, `SELECT obligation_id::text,organization_id::text FROM app.collection_identity_by_external($1)`, reference).Scan(&obligation, &organizationID)
          \tif errors.Is(err, pgx.ErrNoRows) {
          \t\treturn "", "", errors.New("collection attempt not found")
          \t}
          \treturn obligation, organizationID, err
          }
          ''', 'collection identity helpers')

          text = one(text,
          '''func (e *PostgresEngine) ReadAttempts(id string) ([]Attempt, error) {
          \tlocal, err := e.load(context.Background(), id)
          \tif errors.Is(err, pgx.ErrNoRows) {
          \t\treturn []Attempt{}, nil
          \t}
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \treturn local.ListAttempts(id), nil
          }
          ''',
          '''func (e *PostgresEngine) ReadAttempts(id string) ([]Attempt, error) {
          \treturn e.ReadAttemptsContext(context.Background(), id)
          }
          func (e *PostgresEngine) ReadAttemptsContext(ctx context.Context, id string) ([]Attempt, error) {
          \tlocal, err := e.load(ctx, id)
          \tif errors.Is(err, pgx.ErrNoRows) {
          \t\treturn []Attempt{}, nil
          \t}
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \treturn local.ListAttempts(id), nil
          }
          ''', 'ReadAttemptsContext')
          p.write_text(text)

          # Financial read helper: prefer the context-aware collection adapter.
          p = Path('internal/web/financial_reads.go')
          text = p.read_text()
          text = one(text,
          '''func (r *Runtime) readCollectionsAttempts(id string) ([]collections.Attempt, error) {
          \tif source, ok := r.Collections.(interface {
          \t\tReadAttempts(id string) ([]collections.Attempt, error)
          \t}); ok {
          \t\treturn source.ReadAttempts(id)
          \t}
          \treturn r.Collections.ListAttempts(id), nil
          }
          ''',
          '''func (r *Runtime) readCollectionsAttempts(id string) ([]collections.Attempt, error) {
          \treturn r.readCollectionsAttemptsContext(context.Background(), id)
          }
          func (r *Runtime) readCollectionsAttemptsContext(ctx context.Context, id string) ([]collections.Attempt, error) {
          \tif source, ok := r.Collections.(interface {
          \t\tReadAttemptsContext(context.Context, string) ([]collections.Attempt, error)
          \t}); ok {
          \t\treturn source.ReadAttemptsContext(ctx, id)
          \t}
          \tif source, ok := r.Collections.(interface {
          \t\tReadAttempts(id string) ([]collections.Attempt, error)
          \t}); ok {
          \t\treturn source.ReadAttempts(id)
          \t}
          \treturn r.Collections.ListAttempts(id), nil
          }
          ''', 'collection read context')
          p.write_text(text)

          # Worker discovery and execution: global discovery returns only IDs + org;
          # actual operations immediately return to tenant RLS.
          p = Path('internal/web/collection_jobs.go')
          text = p.read_text()
          if '"kredit/internal/db"' not in text:
              text = one(text, '"kredit/internal/config"\n', '"kredit/internal/config"\n\t"kredit/internal/db"\n', 'collection_jobs db import')
          old_pre = '''\tif cfg.RealCollections || cfg.MonoSweepEnabled {
          \t\tif _, err := r.Database.Raw().Exec(ctx, `INSERT INTO app.outbox_events(aggregate_type,aggregate_id,event_type,payload,idempotency_key)
 SELECT 'obligation',s.obligation_id::text,'notification.requested',jsonb_build_object('event','PRE_DEBIT_NOTICE','schedule_item_id',i.id,'amount_kobo',i.principal_due_kobo),app.collection_notice_key(i)
 FROM app.schedule_items i JOIN app.repayment_schedules s ON s.id=i.schedule_id JOIN app.obligations o ON o.id=s.obligation_id
 WHERE o.lifecycle_status='ACTIVE' AND o.outstanding_kobo>0 AND i.state NOT IN ('PAID','CANCELLED') AND i.principal_due_kobo>i.allocated_kobo AND i.collection_at<=now()+interval '31 days'
 ON CONFLICT(idempotency_key) DO NOTHING`); err != nil {
          \t\t\treturn err
          \t\t}
          \t}

          \terr := r.enqueueCollectionPages(ctx, `SELECT id::text,id::text FROM app.collection_attempts WHERE state IN ('PENDING','SUBMITTED','UNKNOWN') AND id::text>$1 ORDER BY id::text LIMIT 100`, jobs.OpReconcileProvider)
          '''
          new_pre = '''\tif cfg.RealCollections || cfg.MonoSweepEnabled {
          \t\tif _, err := r.Database.Raw().Exec(ctx, `SELECT app.enqueue_pre_debit_notices()`); err != nil {
          \t\t\treturn err
          \t\t}
          \t}

          \terr := r.enqueueTenantCollectionPages(ctx, `SELECT resource_id,organization_id::text FROM app.collection_attempt_work_page($1,100)`, jobs.OpReconcileProvider)
          '''
          text = one(text, old_pre, new_pre, 'collection global discovery')
          text = one(text,
          '''\tif _, err = r.Database.Raw().Exec(ctx, `INSERT INTO app.outbox_events(aggregate_type,aggregate_id,event_type,payload,idempotency_key) SELECT 'obligation',s.obligation_id::text,'notification.requested',jsonb_build_object('event',CASE WHEN i.due_at<=now() THEN 'PAYMENT_DUE' ELSE 'UPCOMING_DUE' END,'schedule_item_id',i.id,'amount_kobo',i.principal_due_kobo-i.allocated_kobo),CASE WHEN i.due_at<=now() THEN 'due:' ELSE 'upcoming:' END||i.id::text||':'||i.due_at::text FROM app.schedule_items i JOIN app.repayment_schedules s ON s.id=i.schedule_id JOIN app.obligations o ON o.id=s.obligation_id WHERE o.lifecycle_status='ACTIVE' AND o.outstanding_kobo>0 AND i.state NOT IN ('PAID','CANCELLED') AND i.principal_due_kobo>i.allocated_kobo AND i.due_at<=now()+make_interval(days=>$1) ON CONFLICT(idempotency_key) DO NOTHING`, int(policy.UpcomingNoticeDays)); err != nil {
          \t\treturn err
          \t}
          ''',
          '''\tif _, err = r.Database.Raw().Exec(ctx, `SELECT app.enqueue_due_payment_notices($1)`, int(policy.UpcomingNoticeDays)); err != nil {
          \t\treturn err
          \t}
          ''', 'due notification discovery')
          text = one(text,
          '''\treturn r.enqueueCollectionPages(ctx, `SELECT DISTINCT o.id::text,o.id::text FROM app.obligations o JOIN app.repayment_schedules s ON s.obligation_id=o.id JOIN app.schedule_items i ON i.schedule_id=s.id WHERE o.lifecycle_status='ACTIVE' AND o.outstanding_kobo>0 AND i.state NOT IN ('PAID','CANCELLED') AND i.collection_at<=now() AND i.principal_due_kobo>i.allocated_kobo AND o.id::text>$1 AND NOT EXISTS(SELECT 1 FROM app.collection_reservations r WHERE r.obligation_id=o.id AND r.state IN ('PROCESSING','COMPLETED')) ORDER BY o.id::text LIMIT 100`, "collect_due")
          ''',
          '''\treturn r.enqueueTenantCollectionPages(ctx, `SELECT resource_id,organization_id::text FROM app.collection_due_work_page($1,100)`, "collect_due")
          ''', 'due collection discovery')

          marker = '''func (r *Runtime) HandleCollectionJob(ctx context.Context, cfg config.Config, operation, id string) error {
          '''
          replacement = '''func (r *Runtime) enqueueTenantCollectionPages(ctx context.Context, query, operation string) error {
          \tcursor := ""
          \tfor {
          \t\trows, err := r.Database.Raw().Query(ctx, query, cursor)
          \t\tif err != nil {
          \t\t\treturn err
          \t\t}
          \t\ttype item struct{ id, organizationID string }
          \t\tbatch := []item{}
          \t\tfor rows.Next() {
          \t\t\tvar v item
          \t\t\tif err = rows.Scan(&v.id, &v.organizationID); err != nil {
          \t\t\t\trows.Close()
          \t\t\t\treturn err
          \t\t\t}
          \t\t\tbatch = append(batch, v)
          \t\t}
          \t\terr = rows.Err()
          \t\trows.Close()
          \t\tif err != nil {
          \t\t\treturn err
          \t\t}
          \t\tfor _, v := range batch {
          \t\t\tif err = r.WebhookJobs.EnqueueCollection(ctx, jobs.CollectionArgs{Operation: operation, ResourceID: v.id, OrganizationID: v.organizationID}); err != nil {
          \t\t\t\treturn err
          \t\t\t}
          \t\t\tcursor = v.id
          \t\t}
          \t\tif len(batch) < 100 {
          \t\t\treturn nil
          \t\t}
          \t}
          }

          func (r *Runtime) HandleCollectionJob(ctx context.Context, cfg config.Config, args jobs.CollectionArgs) error {
          \toperation, id := args.Operation, args.ResourceID
          \tif args.OrganizationID != "" {
          \t\tctx = db.WithTenantContext(ctx, "", args.OrganizationID)
          \t}
          '''
          text = one(text, marker, replacement, 'HandleCollectionJob args')
          text = one(text,
          '''\teligibility, err := r.Collections.Eligibility(id, time.Now().UTC())
          ''',
          '''\tvar eligibility collections.Eligibility
          \tvar err error
          \tif scoped, ok := r.Collections.(interface {
          \t\tEligibilityContext(context.Context, string, time.Time) (collections.Eligibility, error)
          \t}); ok {
          \t\teligibility, err = scoped.EligibilityContext(ctx, id, time.Now().UTC())
          \t} else {
          \t\teligibility, err = r.Collections.Eligibility(id, time.Now().UTC())
          \t}
          ''', 'worker eligibility context')
          text = one(text,
          '''\tattempts, err := r.readCollectionsAttempts(id)
          ''',
          '''\tattempts, err := r.readCollectionsAttemptsContext(ctx, id)
          ''', 'worker attempts context')
          text = one(text,
          '''\tvar itemID string
          \tif err = r.Database.Raw().QueryRow(ctx, `SELECT i.id::text FROM app.schedule_items i JOIN app.repayment_schedules s ON s.id=i.schedule_id WHERE s.obligation_id=$1::uuid AND i.state NOT IN ('PAID','CANCELLED') AND i.collection_at<=now() AND i.principal_due_kobo>i.allocated_kobo ORDER BY i.sequence LIMIT 1`, id).Scan(&itemID); err != nil {
          \t\treturn err
          \t}
          ''',
          '''\tvar itemID string
          \ttx, err := r.Database.Raw().Begin(ctx)
          \tif err != nil {
          \t\treturn err
          \t}
          \tdefer func() { _ = tx.Rollback(ctx) }()
          \tif err = db.SetObligationContext(ctx, tx, id); err != nil {
          \t\treturn err
          \t}
          \tif err = tx.QueryRow(ctx, `SELECT i.id::text FROM app.schedule_items i JOIN app.repayment_schedules s ON s.id=i.schedule_id WHERE s.obligation_id=$1::uuid AND i.state NOT IN ('PAID','CANCELLED') AND i.collection_at<=now() AND i.principal_due_kobo>i.allocated_kobo ORDER BY i.sequence LIMIT 1`, id).Scan(&itemID); err != nil {
          \t\treturn err
          \t}
          ''', 'worker due item tenant context')
          p.write_text(text)

          # Provider callback: resolve only identity globally, then normal tenant RLS.
          p = Path('internal/web/mono_handlers.go')
          text = p.read_text()
          if '"kredit/internal/db"' not in text:
              text = one(text, '"kredit/internal/audit"\n', '"kredit/internal/audit"\n\t"kredit/internal/db"\n', 'mono db import')
          text = one(text,
          '''\tif strings.Contains(notice.Type, ".debit.") {
          \t\tvar id string
          \t\tif err := r.Database.Raw().QueryRow(ctx, `SELECT attempt_id::text FROM app.collection_attempt_index WHERE external_reference=$1`, notice.Reference).Scan(&id); err != nil {
          \t\t\treturn errors.New("debit attempt is not yet available")
          \t\t}
          \t\tattempt, ok := r.Collections.GetAttempt(id)
          \t\tif !ok || attempt.MandateReference != notice.MandateID {
          \t\t\treturn errors.New("debit mandate does not match the reserved attempt")
          \t\t}
          \t\t_, err := r.Collections.Reconcile(ctx, id)
          \t\treturn err
          \t}
          ''',
          '''\tif strings.Contains(notice.Type, ".debit.") {
          \t\tvar id, organizationID string
          \t\tif err := r.Database.Raw().QueryRow(ctx, `SELECT attempt_id::text,organization_id::text FROM app.collection_attempt_identity_by_external($1)`, notice.Reference).Scan(&id, &organizationID); err != nil {
          \t\t\treturn errors.New("debit attempt is not yet available")
          \t\t}
          \t\tctx = db.WithTenantContext(ctx, "", organizationID)
          \t\tvar attempt collections.Attempt
          \t\tvar ok bool
          \t\tif scoped, supported := r.Collections.(interface {
          \t\t\tGetAttemptContext(context.Context, string) (collections.Attempt, bool)
          \t\t}); supported {
          \t\t\tattempt, ok = scoped.GetAttemptContext(ctx, id)
          \t\t} else {
          \t\t\tattempt, ok = r.Collections.GetAttempt(id)
          \t\t}
          \t\tif !ok || attempt.MandateReference != notice.MandateID {
          \t\t\treturn errors.New("debit mandate does not match the reserved attempt")
          \t\t}
          \t\t_, err := r.Collections.Reconcile(ctx, id)
          \t\treturn err
          \t}
          ''', 'provider debit tenant context')
          if '"kredit/internal/collections"' not in text:
              text = one(text, '"kredit/internal/audit"\n', '"kredit/internal/audit"\n\t"kredit/internal/collections"\n', 'mono collections import')
          p.write_text(text)

          # Roles: only the worker may call global discovery/identity functions.
          p = Path('infra/postgres/roles.sql')
          text = p.read_text()
          grants = '''
          -- Phase 2 narrow global collection discovery. These functions expose only
          -- resource and tenant identifiers; financial reads/writes still use RLS.
          GRANT EXECUTE ON FUNCTION app.collection_due_work_page(TEXT,INTEGER) TO kredit_worker;
          GRANT EXECUTE ON FUNCTION app.collection_attempt_work_page(TEXT,INTEGER) TO kredit_worker;
          GRANT EXECUTE ON FUNCTION app.collection_identity_by_attempt(UUID) TO kredit_worker;
          GRANT EXECUTE ON FUNCTION app.collection_identity_by_external(TEXT) TO kredit_worker;
          GRANT EXECUTE ON FUNCTION app.collection_attempt_identity_by_external(TEXT) TO kredit_worker;
          GRANT EXECUTE ON FUNCTION app.enqueue_pre_debit_notices() TO kredit_worker;
          GRANT EXECUTE ON FUNCTION app.enqueue_due_payment_notices(INTEGER) TO kredit_worker;
          '''
          if 'collection_due_work_page(TEXT,INTEGER)' not in text:
              text = text.rstrip() + '\n' + grants
          p.write_text(text)
          PY
          gofmt -w internal/jobs/client.go cmd/worker/main.go internal/collections/postgres.go internal/web/financial_reads.go internal/web/collection_jobs.go internal/web/mono_handlers.go
          go test ./internal/jobs ./internal/collections ./internal/web ./cmd/worker
