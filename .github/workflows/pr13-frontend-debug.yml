name: PR13 frontend diagnostic
on:
  push:
    branches: [activation-usability-pass]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Svelte check
        id: svelte_check
        shell: bash
        run: |
          set +e
          pnpm --dir web check 2>&1 | tee svelte-check.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Svelte diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: svelte-check-log
          path: svelte-check.log
      - name: Fail after diagnostic capture
        if: steps.svelte_check.outputs.exit_code != '0'
        run: exit 1
      - name: Frontend build
        run: pnpm --dir web build
      - name: Product-quality tests
        run: pnpm --dir web exec playwright test tests/product-quality.spec.ts
