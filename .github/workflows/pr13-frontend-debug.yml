name: PR13 frontend diagnostic
on:
  push:
    branches: [activation-usability-pass]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Svelte check
        run: pnpm --dir web check
      - name: Frontend build
        run: pnpm --dir web build
      - name: Product-quality tests
        run: pnpm --dir web exec playwright test tests/product-quality.spec.ts
