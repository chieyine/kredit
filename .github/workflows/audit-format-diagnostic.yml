name: Audit formatting diagnostic
on:
  push:
    branches: [audit/2026-09-20-integrity-remediation]
    paths: [.github/workflows/audit-format-diagnostic.yml]
permissions:
  contents: read
jobs:
  formatting:
    if: github.repository == 'chieyine/kredit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0091f3d34f6bff1479873ff39d45381142599f4c
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: .go-version
          cache: false
      - name: Show the formatter's exact changes
        run: |
          test "$(git rev-parse HEAD)" = 0091f3d34f6bff1479873ff39d45381142599f4c
          gofmt -d internal/payments/postgres.go internal/purchasing/delegations.go
          git diff --exit-code
