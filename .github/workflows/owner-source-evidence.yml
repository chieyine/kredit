name: Owner console source evidence
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  source:
    if: >-
      github.repository == 'chieyine/kredit' &&
      github.event.pull_request.number == 15 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Export tracked source without Git credentials
        run: |
          git archive --format=zip --output=/tmp/kredit-owner-source.zip HEAD
          git rev-parse HEAD > /tmp/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: owner-console-source
          path: |
            /tmp/kredit-owner-source.zip
            /tmp/source-commit.txt
          retention-days: 1
