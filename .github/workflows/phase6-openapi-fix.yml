name: Phase 6 OpenAPI Repair

on:
  push:
    branches: [phase6-hardening-polish]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-hardening-polish
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Install dependencies and pinned OpenAPI linter
        run: |
          pnpm install --frozen-lockfile
          npm install --global @redocly/cli@2.51.2
      - name: Repair parser-invalid legacy response descriptions
        run: python3 scripts/phase6-openapi-fix.py
      - name: Verify real OpenAPI parsing and client generation
        env:
          REDOCLY_TELEMETRY: off
          REDOCLY_SUPPRESS_UPDATE_NOTICE: true
        run: |
          redocly lint api/openapi.yaml --max-problems 1000
          bash scripts/openapi-generate.sh
          node scripts/frontend-api-coverage.mjs
      - name: Remove temporary patch harness
        run: rm scripts/phase6-openapi-fix.py .github/workflows/phase6-openapi-fix.yml
      - name: Commit validated contract repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "phase6: make OpenAPI contract parser-valid"
          git push origin HEAD:phase6-hardening-polish
