name: Phase 6 OpenAPI Repair

on:
  push:
    branches: [phase6-hardening-polish]
    paths:
      - 'api/openapi.yaml'
      - 'redocly.yaml'
      - '.github/workflows/phase6-openapi-fix.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-hardening-polish
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - name: Install dependencies and pinned OpenAPI linter
        run: |
          pnpm install --frozen-lockfile
          npm install --global @redocly/cli@2.51.2
      - name: Repair legacy OpenAPI constructs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          path = Path('api/openapi.yaml')
          lines = path.read_text(encoding='utf-8').splitlines()
          pat = re.compile(r"^(?P<prefix>\s*'[^']+'\s*:\s*\{\s*description\s*:\s*)(?P<value>[^{}]*?)(?P<suffix>\s*\}\s*)$")
          quoted = 0
          for i, line in enumerate(lines):
              m = pat.match(line)
              if not m:
                  continue
              value = m.group('value').strip()
              if not value or value.startswith(("'", '"')):
                  continue
              lines[i] = f"{m.group('prefix')}{json.dumps(value, ensure_ascii=False)}{m.group('suffix')}"
              quoted += 1

          text = '\n'.join(lines) + '\n'
          replacements = {
              "verified_since: {type: string, format: date-time, nullable: true, description: Omitted until an authoritative identity-verification date is available; agreement activation is not verification.}":
                  "verified_since: {type: [string, 'null'], format: date-time, description: Omitted until an authoritative identity-verification date is available; agreement activation is not verification.}",
              "score: {type: number, nullable: true}":
                  "score: {type: [number, 'null']}",
          }
          nullable_fixed = 0
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  nullable_fixed += 1

          if quoted == 0 and nullable_fixed == 0:
              raise SystemExit('no legacy OpenAPI constructs required repair')
          path.write_text(text, encoding='utf-8')
          print(f'quoted_response_descriptions={quoted}')
          print(f'openapi31_nullable_repairs={nullable_fixed}')
          PY
      - name: Verify structural OpenAPI validity and client generation
        env:
          REDOCLY_TELEMETRY: off
          REDOCLY_SUPPRESS_UPDATE_NOTICE: 'true'
        run: |
          redocly lint api/openapi.yaml --max-problems 1000
          bash scripts/openapi-generate.sh
          node scripts/frontend-api-coverage.mjs
      - name: Remove temporary workflow and commit validated contract repair
        run: |
          rm -f .github/workflows/phase6-openapi-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/openapi.yaml .github/workflows/phase6-openapi-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'phase6: apply validated OpenAPI 3.1 repair'
          git push origin HEAD:phase6-hardening-polish
