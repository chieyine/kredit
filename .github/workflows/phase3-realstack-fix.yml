name: Phase 3 Real Stack Fix

on:
  push:
    branches: [phase3-financial-proof]
    paths: ['.github/workflows/phase3-realstack-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Apply endpoint and journey fixes
        run: |
          pnpm install --frozen-lockfile
          python3 scripts/phase3_realstack_fix.py
          gofmt -w internal/web/dashboard_handlers.go
          go test ./internal/web
          pnpm --dir web exec tsc --noEmit --pretty false --project tsconfig.json || true
      - name: Commit verified code-only fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/web/dashboard_handlers.go web/tests/real-stack-financial.spec.ts
          git diff --cached --check
          git commit -m 'phase3: tenant-scope dashboard financial reads'
          git push
