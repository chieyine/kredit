name: Product audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: product-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web check
      - run: pnpm --dir web build
      - name: Execute all frontend regressions
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/product-results.json
        run: pnpm --dir web exec playwright test --workers=4 --reporter=list,json,html
      - name: Verify bundled legal publication rendering
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/active-legal.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-active-legal
        run: >-
          pnpm --dir web exec playwright test tests/content-seo.spec.ts
          --grep 'bundled legal details' --output=test-results/active-legal
          --reporter=list,json,html
      - name: Bind evidence to the checked-out source
        if: always()
        run: |
          mkdir -p web/test-results
          git rev-parse HEAD > web/test-results/source-commit.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > web/test-results/candidate-commit.txt
      - name: Preserve synthetic screenshots and test traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-audit-${{ github.sha }}
          path: |
            web/test-results/
            web/playwright-report/
            web/playwright-report-active-legal/
          if-no-files-found: error
          retention-days: 7
