name: Phase 3 Demo Contrast Fix

on:
  push:
    branches: [phase3-financial-proof]
    paths: ['.github/workflows/phase3-demo-contrast-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Apply contrast fix and verify
        run: |
          python3 scripts/fix_phase3_demo_contrast.py
          pnpm --dir web run check
          pnpm --dir web exec playwright test tests/product-quality.spec.ts --project=chromium
      - name: Commit verified UI fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/routes/demo/+page.svelte
          git diff --cached --check
          git commit -m 'fix: meet WCAG contrast on demo controls'
          git push
