name: One-off gofmt repair

on:
  push:
    branches:
      - phase6-hardening-polish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-hardening-polish
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - name: Apply gofmt and commit
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/providers/mono/mono.go internal/providers/mono/phase4_contract_test.go
          if git diff --quiet -- internal/providers/mono/mono.go internal/providers/mono/phase4_contract_test.go; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/providers/mono/mono.go internal/providers/mono/phase4_contract_test.go
          git commit -m "style: gofmt Mono provider Phase 4 files"
          git push origin HEAD:phase6-hardening-polish
