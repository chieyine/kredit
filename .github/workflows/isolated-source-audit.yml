name: Isolated source audit

on:
  push:
    branches: [audit/2026-09-20-source-review]

permissions:
  contents: read

concurrency:
  group: isolated-source-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  AUDITED_SHA: 1bfc68ab338f630e2e023ce079e9227f2285152d

# Audit-branch tooling only. No production credentials, app changes, or deploys.
jobs:
  portable-backend-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1bfc68ab338f630e2e023ce079e9227f2285152d
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: .go-version
          cache: true
      - name: Preserve exact compiler and locked public modules
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          mkdir -p "$RUNNER_TEMP/go-audit" "$RUNNER_TEMP/audit-tools"
          cp -a "$(go env GOROOT)" "$RUNNER_TEMP/go-audit/go"
          cp -a "$(go env GOMODCACHE)" "$RUNNER_TEMP/go-audit/mod"
          go version > "$RUNNER_TEMP/go-audit/version.txt"
          sha256sum go.mod go.sum >> "$RUNNER_TEMP/go-audit/version.txt"
          tar -C "$RUNNER_TEMP/go-audit" -czf "$RUNNER_TEMP/audit-tools/go-runtime.tar.gz" .
          sha256sum "$RUNNER_TEMP/audit-tools/go-runtime.tar.gz" > "$RUNNER_TEMP/audit-tools/go-runtime.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-go-runtime-1bfc68a
          path: ${{ runner.temp }}/audit-tools/go-runtime.*
          if-no-files-found: error
          retention-days: 1
      - name: Package disposable PostgreSQL 18 tooling
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:18
          mkdir -p "$RUNNER_TEMP/pg-audit/usr/lib/postgresql" "$RUNNER_TEMP/pg-audit/usr/share/postgresql" "$RUNNER_TEMP/pg-audit/lib"
          cid=$(docker create postgres:18)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/lib/postgresql/18" "$RUNNER_TEMP/pg-audit/usr/lib/postgresql/"
          docker cp "$cid:/usr/share/postgresql/18" "$RUNNER_TEMP/pg-audit/usr/share/postgresql/"
          docker run --rm --entrypoint sh postgres:18 -c 'for b in postgres initdb pg_ctl psql createdb pg_dump; do ldd /usr/lib/postgresql/18/bin/$b; done' |
            awk '/=> \// {print $3} /^[[:space:]]*\// {print $1}' | sort -u > "$RUNNER_TEMP/pg-libraries.txt"
          while IFS= read -r library; do
            docker cp -L "$cid:$library" "$RUNNER_TEMP/pg-audit/lib/$(basename "$library")"
          done < "$RUNNER_TEMP/pg-libraries.txt"
          docker run --rm --entrypoint postgres postgres:18 --version > "$RUNNER_TEMP/pg-audit/version.txt"
          docker image inspect postgres:18 --format '{{index .RepoDigests 0}}' >> "$RUNNER_TEMP/pg-audit/version.txt"
          tar -C "$RUNNER_TEMP/pg-audit" -czf "$RUNNER_TEMP/audit-tools/postgres-runtime.tar.gz" .
          sha256sum "$RUNNER_TEMP/audit-tools/postgres-runtime.tar.gz" > "$RUNNER_TEMP/audit-tools/postgres-runtime.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-postgres-runtime-1bfc68a
          path: ${{ runner.temp }}/audit-tools/postgres-runtime.*
          if-no-files-found: error
          retention-days: 1
      - name: Install pinned security analysers
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          mkdir -p audit-evidence
      - name: Reachable Go vulnerabilities
        id: vuln
        continue-on-error: true
        run: govulncheck -json ./... > audit-evidence/govulncheck.jsonl 2> audit-evidence/govulncheck.stderr.log
      - name: Go security static analysis
        id: gosec
        if: always()
        continue-on-error: true
        run: gosec -fmt=json -out=audit-evidence/gosec.json ./... > audit-evidence/gosec.stdout.log 2> audit-evidence/gosec.stderr.log
      - name: Staticcheck
        id: staticcheck
        if: always()
        continue-on-error: true
        run: staticcheck ./... > audit-evidence/staticcheck.log 2>&1
      - name: Record analyser outcomes
        if: always()
        env:
          VULN: ${{ steps.vuln.outcome }}
          GOSEC: ${{ steps.gosec.outcome }}
          STATICCHECK: ${{ steps.staticcheck.outcome }}
        run: |
          mkdir -p audit-evidence
          python3 - <<'PY'
          import json, os
          with open('audit-evidence/security-outcomes.json','w') as f:
              json.dump({k:os.environ.get(k) for k in ['AUDITED_SHA','VULN','GOSEC','STATICCHECK']},f,indent=2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-security-evidence-1bfc68a
          path: audit-evidence/
          retention-days: 7

  frontend-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1bfc68ab338f630e2e023ce079e9227f2285152d
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install locked dependencies and Chromium
        run: |
          npm install --global pnpm@11.17.0
          pnpm install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
          mkdir -p audit-evidence
      - name: Preserve portable frontend test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/node-audit" "$RUNNER_TEMP/node-tools"
          node_root=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")
          cp -a "$node_root" "$RUNNER_TEMP/node-audit/node"
          cp -a node_modules "$RUNNER_TEMP/node-audit/node_modules"
          mkdir -p "$RUNNER_TEMP/node-audit/web"
          cp -a web/node_modules "$RUNNER_TEMP/node-audit/web/node_modules"
          node --version > "$RUNNER_TEMP/node-audit/version.txt"
          pnpm --version >> "$RUNNER_TEMP/node-audit/version.txt"
          sha256sum pnpm-lock.yaml >> "$RUNNER_TEMP/node-audit/version.txt"
          tar -C "$RUNNER_TEMP/node-audit" -czf "$RUNNER_TEMP/node-tools/node-runtime.tar.gz" .
          sha256sum "$RUNNER_TEMP/node-tools/node-runtime.tar.gz" > "$RUNNER_TEMP/node-tools/node-runtime.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-node-runtime-1bfc68a
          path: ${{ runner.temp }}/node-tools/node-runtime.*
          if-no-files-found: error
          retention-days: 1
      - name: Type and Svelte checks
        id: check
        continue-on-error: true
        run: pnpm --dir web check > audit-evidence/frontend-check.log 2>&1
      - name: Production frontend build
        id: build
        if: always()
        continue-on-error: true
        run: pnpm --dir web build > audit-evidence/frontend-build.log 2>&1
      - name: Browser tests with installed Chromium
        id: tests
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          cd web
          ./node_modules/.bin/playwright test --reporter=json --global-timeout=600000 > ../audit-evidence/browser-results.json 2> ../audit-evidence/browser-stderr.log
      - name: Contract synchronisation
        id: contract
        if: always()
        continue-on-error: true
        run: node scripts/product-contract-sync.mjs > audit-evidence/contract-sync.log 2>&1
      - name: Frontend dependency advisories
        id: advisories
        if: always()
        continue-on-error: true
        run: pnpm audit --json > audit-evidence/dependency-advisories.json 2> audit-evidence/dependency-advisories.stderr.log
      - name: Record exact frontend outcomes
        if: always()
        env:
          CHECK: ${{ steps.check.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          ADVISORIES: ${{ steps.advisories.outcome }}
        run: |
          mkdir -p audit-evidence
          python3 - <<'PY'
          import json, os
          with open('audit-evidence/frontend-outcomes.json','w') as f:
              json.dump({k:os.environ.get(k) for k in ['AUDITED_SHA','CHECK','BUILD','TESTS','CONTRACT','ADVISORIES']},f,indent=2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-audit-evidence-1bfc68a
          path: audit-evidence/
          retention-days: 7
      - name: Fail on an unsuccessful verification stage
        if: always()
        env:
          CHECK: ${{ steps.check.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
        run: test "$CHECK" = success && test "$BUILD" = success && test "$TESTS" = success && test "$CONTRACT" = success
