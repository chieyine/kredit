name: Audit offline validation tools (temporary)
on:
  push:
    branches: [audit/2026-09-20-integrity-remediation]
    paths: [.github/workflows/audit-offline-validation.yml]
permissions:
  contents: read
jobs:
  tools:
    if: github.repository == 'chieyine/kredit' && github.ref == 'refs/heads/audit/2026-09-20-integrity-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e743f5842126136f5d569d7512874b10226b1dbf
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.17.0
      - name: Prepare exact browser dependencies without application credentials
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --dir web exec playwright install chromium
          mkdir -p "$RUNNER_TEMP/offline/browser" "$RUNNER_TEMP/offline/bin"
          cp "$(command -v node)" "$RUNNER_TEMP/offline/bin/node"
          cp -a node_modules "$RUNNER_TEMP/offline/"
          mkdir -p "$RUNNER_TEMP/offline/web"
          cp -a web/node_modules "$RUNNER_TEMP/offline/web/"
          cp -a "$HOME/.cache/ms-playwright/." "$RUNNER_TEMP/offline/browser/"
          cp .node-version pnpm-lock.yaml "$RUNNER_TEMP/offline/"
      - name: Export official PostgreSQL binaries without a database cluster
        run: |
          set -euo pipefail
          image=postgres:18@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
          docker pull "$image"
          mkdir -p "$RUNNER_TEMP/offline/postgres"
          docker run --rm --entrypoint /bin/bash -v "$RUNNER_TEMP/offline/postgres:/export" "$image" -euc '
            cp -a /usr/lib/postgresql/18 /export/lib
            cp -a /usr/share/postgresql/18 /export/share
            mkdir -p /export/deps
            for file in /usr/lib/postgresql/18/bin/* /usr/lib/postgresql/18/lib/*.so; do
              ldd "$file" 2>/dev/null || true
            done | awk "/=> \\// {print \$3}" | sort -u > /export/dependencies.txt
            while IFS= read -r dep; do cp -L "$dep" /export/deps/; done < /export/dependencies.txt
            /usr/lib/postgresql/18/bin/postgres --version > /export/version.txt
          '
          printf '%s\n' "$image" > "$RUNNER_TEMP/offline/postgres/image.txt"
      - name: Export checksum-verified linter
        run: |
          set -euo pipefail
          archive=golangci-lint-2.13.2-linux-amd64.tar.gz
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 "https://github.com/golangci/golangci-lint/releases/download/v2.13.2/$archive" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' 2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6 "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" golangci-lint-2.13.2-linux-amd64/golangci-lint
          cp "$RUNNER_TEMP/golangci-lint-2.13.2-linux-amd64/golangci-lint" "$RUNNER_TEMP/offline/bin/"
          tar -C "$RUNNER_TEMP/offline" -czf "$RUNNER_TEMP/offline-validation.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-validation-e743f58
          path: ${{ runner.temp }}/offline-validation.tar.gz
          retention-days: 1
          if-no-files-found: error
