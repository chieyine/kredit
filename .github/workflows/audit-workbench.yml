name: Audit workbench (temporary)
on:
  push:
    branches: [audit/2026-09-20-integrity-remediation]
    paths: [.github/workflows/audit-workbench.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'chieyine/kredit' && github.ref == 'refs/heads/audit/2026-09-20-integrity-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate exact patch contents before applying any source
        run: |
          mkdir -p "$RUNNER_TEMP/audit-evidence"
          cp docs/audits/2026-09-20-remediation/round3-edits.zlib.b64 "$RUNNER_TEMP/audit-evidence/transport.b64"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          root = pathlib.Path.cwd().resolve()
          encoded = pathlib.Path('docs/audits/2026-09-20-remediation/round3-edits.zlib.b64').read_text().strip()
          # Only repair the exact diagnosed transport; all independent source hashes stay fixed.
          assert hashlib.sha256(encoded.encode()).hexdigest() == '5c10e56dc84bea22ebd92711779cd5ff843ba870607846be0db6f1af0cf5b576'
          repairs = [[2405,2406,''],[2631,2631,'4'],[3564,3566,''],[3583,3584,''],[4987,4989,'X'],[4997,4999,''],[5023,5029,'9mrv'],[9242,9244,'']]
          for start, end, text in reversed(repairs):
              encoded = encoded[:start] + text + encoded[end:]
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '86d5dc20a9bc245d69b31c6e9fc090a9ddc1c5176586f57a6c566136d0b94683'
          payload = json.loads(raw)
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          seen = set()
          for item in payload['files']:
              relative = pathlib.PurePosixPath(item['path'])
              assert not relative.is_absolute() and '..' not in relative.parts and '.git' not in relative.parts
              assert item['path'] not in seen
              seen.add(item['path'])
              path = root / relative
              assert not path.is_symlink() and path.resolve().is_relative_to(root)
              if item['before'] is None:
                  assert not path.exists(), item['path']
                  source = b''
              else:
                  source = path.read_bytes()
                  assert blob(source) == item['before'], 'Source changed: ' + item['path']
              if item.get('normalize_lf'):
                  result = source.replace(b'\r\n', b'\n')
              else:
                  text = source.decode('utf-8')
                  previous = 0
                  for start, end, replacement in item['edits']:
                      assert 0 <= previous <= start <= end <= len(text)
                      assert isinstance(replacement, str)
                      previous = end
                  for start, end, replacement in reversed(item['edits']):
                      text = text[:start] + replacement + text[end:]
                  result = text.encode('utf-8')
              assert blob(result) == item['after'], 'Result mismatch: ' + item['path']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          subprocess.run(['git', 'diff', '--check'], check=True)
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'validated-patch.json').write_bytes(raw)
          print('Validated', len(seen), 'file changes against independent hashes')
          PY
      - name: Run source-level regression gates
        run: |
          bash scripts/phase6-governance-test.sh
          bash scripts/readme-conformance.sh
          bash scripts/implementation-plan-conformance-test.sh
          node --experimental-strip-types scripts/content-audit.mjs
          node --test web/test-support/public-api.test.mjs
      - name: Register source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          payload = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'validated-patch.json').read_bytes())
          results = []
          for item in payload['files']:
              raw = pathlib.Path(item['path']).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert actual == item['after']
              request = urllib.request.Request('https://api.github.com/repos/chieyine/kredit/git/blobs', data=json.dumps({'content':raw.decode('utf-8'),'encoding':'utf-8'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == actual
              results.append({'path':item['path'],'mode':'100644','type':'blob','sha':actual})
          evidence = {'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree_elements':results}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'audit-evidence' / 'prepared-blobs.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/audit-evidence/
          retention-days: 1
          if-no-files-found: error
