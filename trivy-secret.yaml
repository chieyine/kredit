# Exact dummy values in the archived launch-readiness patch. Preserve the
# historical evidence rather than rewriting its bytes or disabling a detector.
# Trivy evaluates allow rules against the entire detector match, including its
# optional one-character non-word prefix, before extracting the secret group.
# No suffix, alternative credential, path or detector-wide exemption is allowed.
# scripts/trivy-fixture-test.sh proves baseline detection and negative controls.
allow-rules:
  - id: historical-mono-rotation-fixture
    description: Exact dummy value from the archived secret-rotation test
    regex: '^([^0-9a-zA-Z_])?sk_live_verysecretkey1234$'
  - id: historical-paystack-rotation-fixture
    description: Exact dummy value from the archived endpoint test
    regex: '^([^0-9a-zA-Z_])?sk_test_abc1234567890xyz$'
